<title>StockPulse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #000000;
  --bg-card: #0d0d0d;
  --bg-elevated: #161616;
  --bg-sheet: #111111;
  --fg: #f0f0f0;
  --fg-secondary: #737373;
  --fg-dim: #404040;
  --green: #22c55e;
  --green-bg: rgba(34,197,94,0.12);

  --accent-bg: rgba(59,130,246,0.15);
  --border: #1a1a1a;
  --radius: 12px;
  --radius-sm: 8px;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  background: var(--bg); color: var(--fg); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
  max-width: 600px; margin: 0 auto; min-height: 100%; padding-block: 0;
}
body::before {

  height: env(safe-area-inset-top, 0px); z-index: 100; background: var(--bg);
}

button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
input { font-family: inherit; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0 8px;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  background: var(--bg);
}
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
.header-actions { display: flex; gap: 4px; }
.header-btn {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; transition: background 0.15s;
}
.header-btn:active { background: var(--bg-elevated); }

.search-bar { display: none; padding: 0 0 8px; position: relative; }
.search-bar.active { display: block; }
.search-bar input {
  width: 100%; padding: 10px 14px; border-radius: var(--radius);
  background: var(--bg-elevated); border: 1px solid var(--border);
  color: var(--fg); font-size: 15px; outline: none;
}

.search-bar input::placeholder { color: var(--fg-dim); }
.search-results {
  position: absolute; left: 0; right: 0; top: 100%;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); max-height: 360px; overflow-y: auto;
  z-index: 60; display: none;
}
.search-results.active { display: block; }
.search-section-label {
  font-size: 11px; font-weight: 600; color: var(--fg-dim);
  padding: 10px 14px 4px; text-transform: uppercase; letter-spacing: 0.5px;
}
.search-result-item {
  display: flex; align-items: center; padding: 10px 14px; gap: 10px;
  cursor: pointer; transition: background 0.1s;
}
.search-result-item:active { background: var(--bg-elevated); }
.search-result-info { flex: 1; min-width: 0; }
.search-result-ticker { font-size: 14px; font-weight: 600; }
.search-result-name { font-size: 12px; color: var(--fg-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-result-cat {
  font-size: 10px; padding: 2px 6px; border-radius: 4px;

}
.search-result-add { font-size: 20px; color: var(--accent); flex-shrink: 0; width: 28px; text-align: center; font-weight: 300; }
.search-result-check { font-size: 14px; color: var(--green); flex-shrink: 0; width: 28px; text-align: center; }
.search-loading { padding: 8px 14px; font-size: 12px; color: var(--fg-dim); }

.tabs { display: flex; gap: 6px; padding: 4px 0 12px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
  white-space: nowrap; transition: all 0.2s;
  background: var(--bg-card); color: var(--fg-secondary); border: 1px solid var(--border);
}
.tab.active { background: var(--fg); color: var(--bg); border-color: transparent; }

.sort-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 0 0 10px; font-size: 12px; color: var(--fg-secondary);
}
.sort-btn {
  font-size: 12px; color: var(--fg-secondary); padding: 4px 10px;
  border-radius: 14px; background: var(--bg-card); border: 1px solid var(--border);
  transition: all 0.15s;
}
.sort-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }

.stock-list { display: flex; flex-direction: column; }
.stock-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 0; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.1s; position: relative;
  user-select: none; -webkit-user-select: none;
}
.stock-item:active { background: var(--bg-card); }
.stock-item.dragging { opacity: 0.4; }
.stock-item.drag-over::before {
  content: ''; position: absolute; top: -1px; left: 0; right: 0;
  height: 2px; background: var(--accent);
}
.stock-info { flex: 1; min-width: 0; }
.stock-ticker-row { display: flex; align-items: center; gap: 6px; }
.stock-ticker { font-size: 16px; font-weight: 600; }
.position-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.stock-name {
  font-size: 12px; color: var(--fg-secondary); margin-top: 2px;

}
.stock-sparkline { width: 64px; height: 32px; flex-shrink: 0; }
.stock-price-col { text-align: right; flex-shrink: 0; min-width: 80px; }
.stock-price { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stock-change {
  display: inline-block; font-size: 12px; font-weight: 500; padding: 2px 8px;
  border-radius: 6px; margin-top: 3px; font-variant-numeric: tabular-nums;
}
.stock-change.up { color: var(--green); background: var(--green-bg); }
.stock-change.down { color: var(--red); background: var(--red-bg); }
.drag-handle {
  width: 20px; display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 8px 0; cursor: grab; flex-shrink: 0; opacity: 0.3;
}
.drag-handle span { display: block; width: 14px; height: 2px; background: var(--fg-secondary); border-radius: 1px; }
.data-source-tag { font-size: 10px; color: var(--fg-dim); text-align: center; padding: 8px 0 16px; }

.fx-item { display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); gap: 12px; }
.fx-flag { font-size: 22px; flex-shrink: 0; }
.fx-info { flex: 1; }
.fx-pair { font-size: 15px; font-weight: 600; }
.fx-name { font-size: 12px; color: var(--fg-secondary); margin-top: 1px; }
.fx-rate-col { text-align: right; }
.fx-rate { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fx-change { font-size: 12px; margin-top: 2px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--fg-secondary); font-size: 14px; line-height: 1.6; }

.sheet-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 80; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.sheet-overlay.active { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0;
  max-height: 92vh; z-index: 90; background: var(--bg-sheet);
  border-radius: 16px 16px 0 0;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  overflow-y: auto; overflow-x: hidden;
  padding: 0 max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
}
.sheet.active { transform: translateY(0); }
.sheet-handle { width: 36px; height: 4px; background: var(--fg-dim); border-radius: 2px; margin: 10px auto 16px; cursor: grab; touch-action: none; }
.sheet-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
.sheet-close {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--bg-elevated); display: flex; align-items: center;
  justify-content: center; font-size: 20px; color: var(--fg-secondary); flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.detail-ticker { font-size: 24px; font-weight: 700; }
.detail-name { font-size: 13px; color: var(--fg-secondary); margin-top: 2px; }
.detail-price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
.detail-price { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
.detail-change { font-size: 15px; font-weight: 500; }
.time-tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
.time-tabs::-webkit-scrollbar { display: none; }
.time-tab {
  padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 500;
  background: var(--bg-elevated); color: var(--fg-secondary); white-space: nowrap; transition: all 0.15s;
}
.time-tab.active { background: var(--fg); color: var(--bg); }
.chart-container { width: 100%; height: 280px; margin-bottom: 16px; border-radius: var(--radius-sm); overflow: hidden; }
.chart-empty {
  height: 280px; display: flex; align-items: center; justify-content: center;
  color: var(--fg-dim); font-size: 13px; background: var(--bg-card); border-radius: var(--radius-sm);
}
.detail-stats {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 1px; background: var(--border); border-radius: var(--radius-sm);
  overflow: hidden; margin-bottom: 20px;
}
.stat-cell { background: var(--bg-card); padding: 12px 14px; }
.stat-label { font-size: 11px; color: var(--fg-secondary); margin-bottom: 4px; }
.stat-value { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.trade-buttons { display: flex; gap: 10px; margin-bottom: 16px; }
.trade-btn {
  flex: 1; padding: 14px; border-radius: var(--radius);
  font-size: 15px; font-weight: 600; text-align: center; transition: opacity 0.15s;
}
.trade-btn:active { opacity: 0.7; }
.trade-btn.buy { background: var(--green); color: #000; }
.trade-btn.sell { background: var(--red); color: #fff; }
.tv-link {
  display: block; text-align: center; padding: 10px;
  color: var(--fg-secondary); font-size: 12px; text-decoration: none; margin-bottom: 12px;
}
.tv-link:hover { color: var(--fg); }

.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 100; display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--bg-sheet); border-radius: 16px 16px 0 0;
  padding: 24px max(20px, env(safe-area-inset-left, 0px)) max(24px, env(safe-area-inset-bottom, 0px));
  width: 100%; max-width: 600px;
}
.modal-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-label { font-size: 13px; color: var(--fg-secondary); margin-bottom: 6px; display: block; }
.form-input {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm);
  background: var(--bg-elevated); border: 1px solid var(--border);
  color: var(--fg); font-size: 16px; outline: none; font-variant-numeric: tabular-nums;
}
.form-input:focus { border-color: var(--accent); }
.form-hint { font-size: 12px; color: var(--fg-secondary); margin-top: 6px; }
.form-row { display: flex; gap: 10px; margin-top: 20px; }
.form-cancel {
  flex: 1; padding: 14px; border-radius: var(--radius);
  background: var(--bg-elevated); font-size: 15px; font-weight: 500; color: var(--fg-secondary);
}
.form-confirm { flex: 2; padding: 14px; border-radius: var(--radius); font-size: 15px; font-weight: 600; }
.form-confirm.buy { background: var(--green); color: #000; }
.form-confirm.sell { background: var(--red); color: #fff; }

.menu-panel {
  position: fixed; inset: 0; z-index: 85; background: var(--bg);
  transform: translateX(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  overflow-y: auto;
  padding: env(safe-area-inset-top, 0px) max(20px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
}
.menu-panel.active { transform: translateX(0); }
.menu-header { display: flex; align-items: center; gap: 12px; padding: 16px 0 20px; }
.menu-back {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg-elevated); display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.menu-title { font-size: 20px; font-weight: 600; }
.menu-item {
  display: flex; align-items: center; gap: 14px;
  padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px; cursor: pointer;
}
.menu-item:active { opacity: 0.6; }
.menu-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.menu-icon svg { width: 20px; height: 20px; }

.pos-card { background: var(--bg-card); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px; }
.pos-row { display: flex; justify-content: space-between; align-items: center; }
.pos-ticker { font-weight: 600; font-size: 15px; }
.pos-detail { font-size: 13px; color: var(--fg-secondary); margin-top: 6px; display: flex; gap: 16px; }
.pos-pnl { font-weight: 500; }
.log-card {
  background: var(--bg-card); border-radius: var(--radius-sm);
  padding: 12px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 12px;
}
.log-type { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
.log-type.buy { color: var(--green); background: var(--green-bg); }
.log-type.sell { color: var(--red); background: var(--red-bg); }
.log-info { flex: 1; min-width: 0; }
.log-ticker { font-weight: 600; font-size: 14px; }
.log-meta { font-size: 12px; color: var(--fg-secondary); margin-top: 2px; }
.log-amount { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.journal-card { background: var(--bg-card); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px; }
.journal-date { font-size: 12px; color: var(--fg-secondary); margin-bottom: 6px; }
.journal-content { font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
.loading { text-align: center; padding: 40px; color: var(--fg-dim); font-size: 13px; }
.toast {
  position: fixed; bottom: max(80px, calc(env(safe-area-inset-bottom, 0px) + 20px));
  left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--bg-elevated); border: 1px solid var(--border);
  padding: 12px 24px; border-radius: var(--radius);
  font-size: 14px; z-index: 200; opacity: 0; transition: all 0.3s;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.api-status {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--fg-secondary);
}
.api-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.api-dot.on { background: var(--green); }
.api-dot.off { background: var(--red); }

@keyframes spin { to { transform: rotate(360deg); } }
.spinning svg { animation: spin 0.8s linear infinite; }
</style>

<div id="auth-gate" style="display:none;position:fixed;inset:0;z-index:9999;background:#000;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font)">

      </button>
    </div>

  <div class="search-bar" id="search-bar">

<script>
(function(){
  const PW = 'Jeoi2026', PK = 'sp_auth';
  const saved = localStorage.getItem(PK);
  if (saved === PW) {
    document.getElementById('app').style.display = '';
  } else {
    const gate = document.getElementById('auth-gate');
    gate.style.display = 'flex';
    document.getElementById('sp-pw').addEventListener('keydown', function(e) {
      if (e.key !== 'Enter') return;
      const v = this.value.trim();
      if (v === PW) {
        localStorage.setItem(PK, v);

      }
    });
    return;
  }
})();

  async function fh(endpoint, params = {}) {
    if (endpoint === 'quote') {
      try { const r = await fetch('/api/stockpulse/quote?symbol=' + encodeURIComponent(params.symbol)); if (!r.ok) return null; return await r.json(); } catch(e) { return null; }
    }
    if (endpoint === 'stock/candle' || endpoint === 'crypto/candle') {

      } catch(e) { return null; }

    if (endpoint === 'forex/rates') {
      try { const r = await fetch('/api/stockpulse/fx'); if (!r.ok) return null; return await r.json(); } catch(e) { return null; }
    }
    if (endpoint === 'search') {
      try { const r = await fetch('/api/stockpulse/search?q=' + encodeURIComponent(params.q)); if (!r.ok) return null; return await r.json(); } catch(e) { return null; }
    }

  async function refreshAllQuotes() {
    const btn = $('btn-refresh');
    btn.classList.add('spinning');
    try {
      if (finnhubKey) {
        for (const s of stocks) {
          if (s.category === 'crypto') continue;
          let got = false;
          const q = await fh('quote', { symbol: s.ticker });
          if (q && q.c > 0) {
            const chg = (q.d != null && q.d !== 0) ? q.d : (q.pc ? q.c - q.pc : 0);
            const chgPct = (q.dp != null && q.dp !== 0) ? q.dp : (q.pc ? ((q.c - q.pc) / q.pc * 100) : 0);
            Object.assign(s, { price: q.c, change: chg, changePercent: parseFloat(chgPct.toFixed(2)), open: q.o != null ? q.o : null, high: q.h != null ? q.h : null, low: q.l != null ? q.l : null, prevClose: q.pc != null ? q.pc : null, volume: q.v != null ? q.v : s.volume, lastUpdated: new Date().toISOString() });
            got = true;
          }
          if (!got) {
            const to = Math.floor(Date.now() / 1000);
            const cd = await fh('stock/candle', { symbol: s.ticker, resolution: 'D', from: to - 5*86400, to });
            if (cd?.s === 'ok' && cd.t?.length >= 1) {
              const li = cd.c.length - 1, pi = li >= 1 ? li - 1 : li;
              const price = cd.c[li], pc = cd.c[pi];
              const chg = price - pc, chgPct = pc ? (chg / pc * 100) : 0;
              const vol = cd.v ? cd.v[li] : null;
              Object.assign(s, { price, change: chg, changePercent: parseFloat(chgPct.toFixed(2)), open: cd.o[li], high: cd.h[li], low: cd.l[li], prevClose: pc, volume: vol, lastUpdated: new Date().toISOString() });
            }
          }
          if (!s.sparkline) s.sparkline = [];
          if (s.price != null) { s.sparkline.push(s.price); if (s.sparkline.length > 30) s.sparkline = s.sparkline.slice(-30); }
          await new Promise(r => setTimeout(r, 150));
        }
        const fxData = await fh('forex/rates', { base: 'USD' });
        if (fxData && fxData.quote) {
          for (const pair of TICKER_DB.filter(t => t.cat === 'fx')) {
            let rate;
            if (pair.base === 'USD' && fxData.quote[pair.quote]) rate = fxData.quote[pair.quote];
            else if (pair.quote === 'USD' && fxData.quote[pair.base]) rate = 1 / fxData.quote[pair.base];
            else if (fxData.quote[pair.base] && fxData.quote[pair.quote]) rate = fxData.quote[pair.quote] / fxData.quote[pair.base];
            if (rate) { const prev = fxRates[pair.ticker]; fxRates[pair.ticker] = rate; if (prev) fxPrevRates[pair.ticker] = prev; }

  async function fetchFxFree() {
    try {
      const res = await fetch('https://api.exchangerate-api.com/v4/latest/USD');

      for (const pair of TICKER_DB.filter(t => t.cat === 'fx')) {
        let rate;
        if (pair.base === 'USD' && data.rates[pair.quote]) rate = data.rates[pair.quote];
        else if (pair.quote === 'USD' && data.rates[pair.base]) rate = 1 / data.rates[pair.base];
        else if (data.rates[pair.base] && data.rates[pair.quote]) rate = data.rates[pair.quote] / data.rates[pair.base];
        if (rate) { const prev = fxRates[pair.ticker]; fxRates[pair.ticker] = rate; if (prev) fxPrevRates[pair.ticker] = prev; }
      }
      if (currentCat === 'fx') renderList();
    } catch(e) {}
  }

  async function fetchCryptoPrices() {
    const cryptoStocks = stocks.filter(s => s.category === 'crypto');
    if (!cryptoStocks.length) return;
    const cgIds = cryptoStocks.map(s => { const e = TICKER_DB.find(t => t.ticker === s.ticker); return e?.cgId; }).filter(Boolean);
    if (!cgIds.length) return;
    try {
      const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=' + cgIds.join(',') + '&vs_currencies=usd&include_24hr_change=true');
      if (!res.ok) return; const data = await res.json();
      for (const s of cryptoStocks) {
        const e = TICKER_DB.find(t => t.ticker === s.ticker);
        if (!e?.cgId || !data[e.cgId]) continue;
        const info = data[e.cgId];
        if (info.usd) {
          s.price = info.usd;
          if (info.usd_24h_change) s.changePercent = parseFloat(info.usd_24h_change.toFixed(2));
          if (!s.sparkline) s.sparkline = [];
          s.sparkline.push(info.usd);
          if (s.sparkline.length > 30) s.sparkline = s.sparkline.slice(-30);

      if (currentCat === 'crypto') renderList();
    } catch(e) {}

    $('sort-bar').style.display = 'flex';

      const q = searchQuery.toLowerCase();
      items = items.filter(s => s.ticker.toLowerCase().includes(q) || (s.name || '').toLowerCase().includes(q));

    items = sortStocks(items);
    if (!items.length) {
      const cn = {us:'美股',crypto:'加密货币',hk:'港股',index:'指数'}[currentCat] || '';
      listEl.innerHTML = '<div class="empty-state">此板块暂无关注的标的<br><span style="font-size:12px;color:var(--fg-dim)">点击搜索图标添加' + cn + '</span></div>';
      return;
    }
    listEl.innerHTML = items.map((s, i) => {
      const cp = s.changePercent || 0, dir = cp >= 0 ? 'up' : 'down', sign = cp >= 0 ? '+' : '';

        '<div class="stock-sparkline">' + spark + '</div>' +
        '<div class="stock-price-col"><div class="stock-price">' + fmtPrice(s.price, s.category) + '</div><span class="stock-change ' + dir + '">' + sign + cp.toFixed(2) + '%</span></div></div>';
    }).join('');
    const srcMap = { us: 'Finnhub 实时', crypto: 'CoinGecko 实时', hk: 'Finnhub', index: 'Finnhub' };

      el.addEventListener('click', e => { if (!e.target.closest('.drag-handle')) openDetail(el.dataset.ticker); });

  }

  function renderFxList() {
    $('sort-bar').style.display = 'none';
    const pairs = TICKER_DB.filter(t => t.cat === 'fx');
    if (!Object.keys(fxRates).length) { listEl.innerHTML = '<div class="loading">汇率加载中...</div>'; return; }
    listEl.innerHTML = pairs.map(p => {
      const rate = fxRates[p.ticker]; if (!rate) return '';
      const prev = fxPrevRates[p.ticker] || rate;
      const chg = prev ? ((rate - prev) / prev * 100) : 0;
      const color = chg >= 0 ? 'var(--green)' : 'var(--red)', sign = chg >= 0 ? '+' : '';
      const dec = rate > 100 ? 2 : rate > 10 ? 3 : 4;
      return '<div class="fx-item"><div class="fx-flag">' + (p.flag||'') + '</div><div class="fx-info"><div class="fx-pair">' + p.base + '/' + p.quote + '</div><div class="fx-name">' + p.name + '</div></div><div class="fx-rate-col"><div class="fx-rate">' + rate.toFixed(dec) + '</div><div class="fx-change" style="color:' + color + '">' + sign + chg.toFixed(3) + '%</div></div></div>';
    }).filter(Boolean).join('');
    listEl.innerHTML += '<div class="data-source-tag">Finnhub + ExchangeRate-API</div>';
  }

  function sortStocks(items) {
    const a = [...items];
    if (currentSort === 'change') a.sort((x, y) => Math.abs(y.changePercent || 0) - Math.abs(x.changePercent || 0));
    else if (currentSort === 'price') a.sort((x, y) => (y.price || 0) - (x.price || 0));
    else a.sort((x, y) => { if (x.hasPosition !== y.hasPosition) return x.hasPosition ? -1 : 1; return (x.order ?? 999) - (y.order ?? 999); });
    return a;
  }

  function renderSparkline(data, dir) {
    if (!data?.length) return '';
    const w = 64, h = 32, pad = 2;
    const mn = Math.min(...data), mx = Math.max(...data), rng = mx - mn || 1;
    const pts = data.map((v, i) => (pad + i / (data.length - 1) * (w - pad * 2)).toFixed(1) + ',' + (pad + (1 - (v - mn) / rng) * (h - pad * 2)).toFixed(1)).join(' ');
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '"><polyline points="' + pts + '" fill="none" stroke="' + (dir === 'up' ? 'var(--green)' : 'var(--red)') + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function fmtPrice(p, cat) {
    if (p == null) return '—';
    if (cat === 'crypto' && p < 1) return '$' + p.toFixed(6);
    return '$' + (p >= 1000 ? p.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : p.toFixed(2));
  }

  function doSearch(q) {
    const rEl = $('search-results');
    if (!q) { rEl.classList.remove('active'); searchQuery = ''; renderList(); return; }
    searchQuery = q; showLocalResults(q);
    if (searchTimer) clearTimeout(searchTimer);
    if (q.length >= 2) searchTimer = setTimeout(() => fhSearch(q), 350);
  }

  function showLocalResults(q) {
    const rEl = $('search-results'), ql = q.toLowerCase();
    const watched = new Set(stocks.map(s => s.ticker));
    const wMatches = stocks.filter(s => s.ticker.toLowerCase().includes(ql) || (s.name || '').toLowerCase().includes(ql)).slice(0, 5);
    const aMatches = TICKER_DB.filter(t => !watched.has(t.ticker) && (t.ticker.toLowerCase().includes(ql) || t.name.toLowerCase().includes(ql))).slice(0, 6);
    if (!wMatches.length && !aMatches.length) {
      rEl.innerHTML = '<div style="padding:14px;text-align:center;color:var(--fg-dim);font-size:13px">输入代码回车直接添加<br>Finnhub 搜索中...</div>';
      rEl.classList.add('active'); return;
    }
    let html = '';
    if (wMatches.length) {
      html += '<div class="search-section-label">已关注</div>' + wMatches.map(s =>
        '<div class="search-result-item" data-action="open" data-ticker="' + s.ticker + '"><div class="search-result-info"><div class="search-result-ticker">' + s.ticker + '</div><div class="search-result-name">' + (s.name || '') + '</div></div><span class="search-result-check">&#10003;</span></div>'
      ).join('');
    }
    if (aMatches.length) {
      html += '<div class="search-section-label">添加到关注</div>' + aMatches.map(t => {
        const cl = {us:'美股',crypto:'加密',hk:'港股',index:'指数',fx:'汇率'}[t.cat] || '';
        return '<div class="search-result-item" data-action="add" data-ticker="' + t.ticker + '" data-cat="' + t.cat + '" data-name="' + t.name + '" data-ex="' + t.ex + '"><div class="search-result-info"><div class="search-result-ticker">' + t.ticker + '</div><div class="search-result-name">' + t.name + '</div></div><span class="search-result-cat">' + cl + '</span><span class="search-result-add">+</span></div>';
      }).join('');
    }
    if (q.length >= 2) html += '<div class="search-loading">Finnhub 搜索中...</div>';
    rEl.innerHTML = html; rEl.classList.add('active'); bindSearchClicks();
  }

  async function fhSearch(q) {
    const data = await fh('search', { q });
    if (!data?.result?.length) { const el = document.querySelector('.search-loading'); if (el) el.remove(); return; }
    const watched = new Set(stocks.map(s => s.ticker));
    const localTickers = new Set(TICKER_DB.map(t => t.ticker));
    const results = data.result.filter(r => r.symbol && !watched.has(r.symbol) && !localTickers.has(r.symbol)).slice(0, 8);
    if (!results.length) { const el = document.querySelector('.search-loading'); if (el) el.remove(); return; }
    const rEl = $('search-results'), loadEl = rEl.querySelector('.search-loading');
    let html = '<div class="search-section-label">FINNHUB</div>' + results.map(r => {
      const cat = guessCat(r), cl = {us:'美股',crypto:'加密',hk:'港股',index:'指数'}[cat] || r.type || '';
      return '<div class="search-result-item" data-action="add" data-ticker="' + (r.displaySymbol || r.symbol) + '" data-cat="' + cat + '" data-name="' + (r.description || '') + '" data-ex="' + (r.type || '') + '"><div class="search-result-info"><div class="search-result-ticker">' + (r.displaySymbol || r.symbol) + '</div><div class="search-result-name">' + (r.description || '') + '</div></div><span class="search-result-cat">' + cl + '</span><span class="search-result-add">+</span></div>';

  function guessCat(r) {
    const t = (r.type || '').toLowerCase();
    if (t.includes('crypto')) return 'crypto';
    const s = r.symbol || '';
    if (s.includes('.HK')) return 'hk';
    if (s.startsWith('^')) return 'index';
    return 'us';

  function bindSearchClicks() {
    $('search-results').querySelectorAll('.search-result-item').forEach(el => {

  async function addToWatchlist(ticker, name, cat, ex) {
    if (stocks.find(s => s.ticker === ticker)) { showToast(ticker + ' 已在列表'); return; }
    const maxOrd = stocks.filter(s => s.category === (cat || 'us')).reduce((m, s) => Math.max(m, s.order ?? 0), -1);
    const ns = { ticker, name: name || ticker, category: cat || 'us', exchange: ex || '', price: null, change: 0, changePercent: 0, sparkline: [], order: maxOrd + 1, hasPosition: false };
    stocks.push(ns); saveStocks(); showToast('已添加 ' + ticker); renderList();
    if (cat !== 'crypto') {
      const q = await fh('quote', { symbol: ticker });
      if (q?.c > 0) {
        Object.assign(ns, { price: q.c, change: q.d, changePercent: parseFloat((q.dp||0).toFixed(2)), open: q.o, high: q.h, low: q.l, prevClose: q.pc });
        ns.sparkline.push(q.c);
        renderList();
      }
    }
    if (cat === 'crypto') fetchCryptoPrices();
  }

  let dragSrc = null;
  function initDragSort() {
    listEl.querySelectorAll('.stock-item').forEach(el => {
      el.addEventListener('dragstart', e => { dragSrc = el; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', el.dataset.ticker); });
      el.addEventListener('dragend', () => { el.classList.remove('dragging'); listEl.querySelectorAll('.stock-item').forEach(x => x.classList.remove('drag-over')); dragSrc = null; });
      el.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (el !== dragSrc) el.classList.add('drag-over'); });
      el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
      el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drag-over'); if (dragSrc && dragSrc !== el) saveDragOrder(dragSrc.dataset.ticker, el.dataset.ticker); });
    });
  }

  function saveDragOrder(from, to) {
    const cat = stocks.filter(s => s.category === currentCat).sort((a, b) => (a.order ?? 999) - (b.order ?? 999));
    const ts = cat.map(s => s.ticker);
    const fi = ts.indexOf(from), ti = ts.indexOf(to);
    if (fi < 0 || ti < 0) return;
    ts.splice(fi, 1); ts.splice(ti, 0, from);
    ts.forEach((t, i) => { const s = stocks.find(x => x.ticker === t); if (s) s.order = i; });
    saveStocks(); renderList();
  }

  function getUSTime() {
    try {
      const now = new Date();
      const et = now.toLocaleString('en-US', { timeZone: 'America/New_York', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
      const h = now.toLocaleString('en-US', { timeZone: 'America/New_York', hour: 'numeric', hour12: false });
      const hr = parseInt(h);
      const day = now.toLocaleString('en-US', { timeZone: 'America/New_York', weekday: 'short' });
      const isWeekend = ['Sat','Sun'].includes(day);
      const isOpen = !isWeekend && hr >= 9 && (hr < 16 || (hr === 9 && parseInt(now.toLocaleString('en-US', { timeZone: 'America/New_York', minute: 'numeric' })) >= 30));
      return { text: 'ET ' + et, isOpen };
    } catch(e) { return { text: '', isOpen: false }; }
  }

  function renderDetailStats(s) {
    const usTime = getUSTime();
    const timeHtml = usTime.text ? '<div style="grid-column:1/-1;background:var(--bg-card);padding:10px 14px;font-size:12px;color:var(--fg-secondary);display:flex;align-items:center;gap:6px"><span class="api-dot ' + (usTime.isOpen ? 'on' : 'off') + '"></span>' + usTime.text + (usTime.isOpen ? ' · 交易中' : ' · 已收盘') + '</div>' : '';
    $('detail-stats').innerHTML = timeHtml + [
      ['今日开盘', s.open], ['今日最高', s.high], ['今日最低', s.low],
      ['昨收', s.prevClose], ['成交量', s.volume ? fmtVol(s.volume) : null], ['市值', s.marketCap ? fmtCap(s.marketCap) : null]
    ].map(function(pair) { const l = pair[0], v = pair[1]; return '<div class="stat-cell"><div class="stat-label">' + l + '</div><div class="stat-value">' + (v != null ? (typeof v === 'number' ? fmtPrice(v) : v) : '—') + '</div></div>'; }).join('');
  }

  function updateDetailPrice(s) {
    $('detail-price').textContent = fmtPrice(s.price, s.category);
    const cp = s.changePercent || 0, ch = s.change || 0, sign = cp >= 0 ? '+' : '';
    const cel = $('detail-change');
    cel.textContent = sign + ch.toFixed(2) + ' (' + sign + cp.toFixed(2) + '%)';
    cel.style.color = cp >= 0 ? 'var(--green)' : 'var(--red)';

  async function openDetail(ticker) {
    currentTicker = ticker;
    const s = stocks.find(x => x.ticker === ticker);
    if (!s) return;
    $('detail-ticker').textContent = ticker;
    $('detail-name').textContent = s.name || '';
    updateDetailPrice(s);
    renderDetailStats(s);
    $('tv-link').href = 'https://www.tradingview.com/chart/?symbol=' + (s.exchange || 'NASDAQ') + ':' + ticker;
    $('btn-sell').style.opacity = positions[ticker] ? '1' : '0.3';
    showSheet();
    currentRes = 'D';
    document.querySelectorAll('.time-tab').forEach(t => t.classList.toggle('active', t.dataset.res === 'D'));
    loadCandles(ticker);
    if (s.category !== 'crypto') {
      let got = false;
      const q = await fh('quote', { symbol: ticker });
      if (q && q.c > 0) {
        const chg = (q.d != null && q.d !== 0) ? q.d : (q.pc ? q.c - q.pc : 0);
        const chgPct = (q.dp != null && q.dp !== 0) ? q.dp : (q.pc ? ((q.c - q.pc) / q.pc * 100) : 0);
        Object.assign(s, { price: q.c, change: chg, changePercent: parseFloat(chgPct.toFixed(2)), open: q.o != null ? q.o : null, high: q.h != null ? q.h : null, low: q.l != null ? q.l : null, prevClose: q.pc != null ? q.pc : null, volume: q.v != null ? q.v : s.volume });
        got = true;
      }
      if (!got) {
        const to = Math.floor(Date.now() / 1000);
        const cd = await fh('stock/candle', { symbol: ticker, resolution: 'D', from: to - 5*86400, to });
        if (cd?.s === 'ok' && cd.t?.length >= 1) {
          const li = cd.c.length - 1, pi = li >= 1 ? li - 1 : li;
          const price = cd.c[li], pc = cd.c[pi];
          const chg = price - pc, chgPct = pc ? (chg / pc * 100) : 0;
          const vol = cd.v ? cd.v[li] : null;
          Object.assign(s, { price, change: chg, changePercent: parseFloat(chgPct.toFixed(2)), open: cd.o[li], high: cd.h[li], low: cd.l[li], prevClose: pc, volume: vol });
        }
      }
      updateDetailPrice(s);
      renderDetailStats(s);
      renderList();
      // Fetch marketCap in background
      if (s.category === 'us' || s.category === 'hk') {
        fetch('/api/stockpulse/profile?symbol=' + encodeURIComponent(ticker))
          .then(r => r.ok ? r.json() : {})
          .then(pd => { if (pd.marketCap) { s.marketCap = pd.marketCap; if (currentTicker === ticker) renderDetailStats(s); } })
          .catch(() => {});
      }
    }
  }

  function fmtVol(v) { return v >= 1e9 ? (v/1e9).toFixed(2)+'亿' : v >= 1e4 ? (v/1e4).toFixed(0)+'万' : String(v); }
  function fmtCap(v) { return v >= 1e12 ? '$'+(v/1e12).toFixed(2)+'万亿' : v >= 1e8 ? '$'+(v/1e8).toFixed(2)+'亿' : '$'+v; }

  async function loadCandles(ticker) {
    const empty = $('chart-empty');
    empty.style.display = 'flex'; empty.textContent = 'K线加载中...';
    if (chart) { chart.remove(); chart = null; candleSeries = null; }
    const isCrypto = stocks.find(s => s.ticker === ticker)?.category === 'crypto';
    let data = null;
    const cfg = {
      '15': { sec: 15*60, res: '1', yInt: '1m', yRng: '1d' },
      '60': { sec: 60*60, res: '1', yInt: '2m', yRng: '1d' },
      'D':  { sec: 86400, res: '5', yInt: '5m', yRng: '1d' },
      'W':  { sec: 7*86400, res: '60', yInt: '60m', yRng: '5d' },
      'M':  { sec: 30*86400, res: 'D', yInt: '1d', yRng: '1mo' },
    }[currentRes] || { sec: 86400, res: '5', yInt: '5m', yRng: '1d' };
    if (finnhubKey) {
      const to = Math.floor(Date.now() / 1000);
      const from = to - cfg.sec;
      const endpoint = isCrypto ? 'crypto/candle' : 'stock/candle';
      const symbol = isCrypto ? 'BINANCE:' + ticker.replace('-USD', 'USDT') : ticker;
      data = await fh(endpoint, { symbol, resolution: cfg.res, from, to });
    }
    if (!(data?.s === 'ok' && data?.t?.length) && !isCrypto) {
      try {
        const r = await fetch('/api/stockpulse/candle?symbol=' + encodeURIComponent(ticker) + '&interval=' + cfg.yInt + '&range=' + cfg.yRng);
        if (r.ok) data = await r.json();
      } catch(e) {}
    }
    // 15m/1h: 裁剪到目标时间窗口，不显示窗口外的蜡烛
    if (data?.s === 'ok' && data?.t?.length && cfg.sec < 86400) {
      const cutoff = Math.floor(Date.now() / 1000) - cfg.sec;
      const idx = data.t.reduce((a, t, i) => { if (t >= cutoff) a.push(i); return a; }, []);
      if (idx.length) { data = { s:'ok', t:idx.map(i=>data.t[i]), o:idx.map(i=>data.o[i]), h:idx.map(i=>data.h[i]), l:idx.map(i=>data.l[i]), c:idx.map(i=>data.c[i]) }; }
      else { data = { s:'no_data' }; }
    }
    const useTimestamp = cfg.res !== 'D';
    if (data?.s === 'ok' && data.t?.length) {
      const seen = new Set();
      const candles = data.t.map((t, i) => {
        const o = data.o[i], h = data.h[i], l = data.l[i], c = data.c[i];
        if (o == null || h == null || l == null || c == null) return null;
        let time;
        if (useTimestamp) { time = t; } else { time = new Date(t * 1000).toISOString().slice(0, 10); if (seen.has(time)) return null; seen.add(time); }
        return { time, open: o, high: h, low: l, close: c };
      }).filter(Boolean);
      if (candles.length) { empty.style.display = 'none'; renderChart($('chart-container'), candles, useTimestamp, currentRes === 'W'); }
      else { empty.textContent = '暂无K线数据'; }
    } else { empty.textContent = '暂无K线数据'; }
  }

  function renderChart(container, data, timeVisible, dateOnly) {
    const tsOpts = { borderColor: '#222', timeVisible: timeVisible !== false };
    if (dateOnly) {
      tsOpts.timeVisible = false;
      tsOpts.tickMarkFormatter = function(t) {
        var d = new Date(t * 1000);
        return (d.getMonth() + 1) + '/' + d.getDate();
      };
    }
    chart = LightweightCharts.createChart(container, {
      layout: { background: { type: 'solid', color: '#000' }, textColor: '#666', fontFamily: 'Inter, sans-serif', fontSize: 11 },
      grid: { vertLines: { color: '#111' }, horzLines: { color: '#111' } },
      timeScale: tsOpts,
      rightPriceScale: { borderColor: '#222' },
      crosshair: { mode: 0, vertLine: { color: '#333', width: 1 }, horzLine: { color: '#333', width: 1 } },
      handleScroll: { vertTouchDrag: false },
    });
    candleSeries = chart.addCandlestickSeries({
      upColor: '#22c55e', downColor: '#ef4444', borderUpColor: '#22c55e', borderDownColor: '#ef4444', wickUpColor: '#22c55e', wickDownColor: '#ef4444',
    });
    candleSeries.setData(data);
    chart.timeScale().fitContent();
  }

  function showSheet() { $('sheet-overlay').classList.add('active'); $('detail-sheet').classList.add('active'); document.body.style.overflow = 'hidden'; }
  function hideSheet() { $('sheet-overlay').classList.remove('active'); $('detail-sheet').classList.remove('active'); document.body.style.overflow = ''; const sh = $('detail-sheet'); sh.style.transform = ''; sh.style.transition = ''; if (chart) { chart.remove(); chart = null; candleSeries = null; } }

  (function initSheetSwipe() {
    const sheet = $('detail-sheet');
    let startY = 0, currentY = 0, dragging = false;
    function onStart(e) {
      const touch = e.touches ? e.touches[0] : e;
      const target = e.target.closest('.sheet-handle, .sheet-header');
      if (!target) return;
      if (sheet.scrollTop > 0 && !e.target.closest('.sheet-handle')) return;
      dragging = true; startY = touch.clientY; currentY = 0;
      sheet.style.transition = 'none';
    }
    function onMove(e) {
      if (!dragging) return;
      const touch = e.touches ? e.touches[0] : e;
      currentY = Math.max(0, touch.clientY - startY);
      sheet.style.transform = 'translateY(' + currentY + 'px)';
      if (currentY > 10) e.preventDefault();
    }
    function onEnd() {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = '';
      if (currentY > 100) { hideSheet(); } else { sheet.style.transform = 'translateY(0)'; }
    }
    sheet.addEventListener('touchstart', onStart, { passive: true });
    sheet.addEventListener('touchmove', onMove, { passive: false });
    sheet.addEventListener('touchend', onEnd);
  })();

  async function openTrade(type) {
    if (!currentTicker) return;
    tradeType = type;
    const s = stocks.find(x => x.ticker === currentTicker);
    if (!s) return;
    const pos = positions[currentTicker];
    if (type === 'sell' && !pos) { showToast('暂无持仓'); return; }
    if (!s.price && s.category !== 'crypto') {
      const q = await fh('quote', { symbol: currentTicker });
      if (q?.c > 0) { s.price = q.c; }
      else {
        const to = Math.floor(Date.now() / 1000);
        const cd = await fh('stock/candle', { symbol: currentTicker, resolution: 'D', from: to - 5*86400, to });
        if (cd?.s === 'ok' && cd.c?.length) s.price = cd.c[cd.c.length - 1];
      }
    }
    $('trade-title').textContent = (type === 'buy' ? '买入 ' : '卖出 ') + currentTicker;
    $('trade-shares').value = ''; $('trade-amount').textContent = '$0.00';
    $('trade-hint').textContent = type === 'buy' ? '当前价格 ' + fmtPrice(s.price, s.category) : '持仓 ' + pos.shares + ' 股 · 均价 ' + fmtPrice(pos.avgCost);
    const cf = $('trade-confirm'); cf.className = 'form-confirm ' + type; cf.textContent = type === 'buy' ? '确认买入' : '确认卖出';
    $('trade-modal').classList.add('active');
    setTimeout(() => $('trade-shares').focus(), 100);
  }

  $('trade-shares').addEventListener('input', () => {
    const s = stocks.find(x => x.ticker === currentTicker);
    $('trade-amount').textContent = '$' + ((parseFloat($('trade-shares').value) || 0) * (s?.price || 0)).toFixed(2);
  });

  function executeTrade() {
    if (!currentTicker) return;
    const shares = parseFloat($('trade-shares').value);
    if (!shares || shares <= 0) { showToast('请输入有效数量'); return; }
    const s = stocks.find(x => x.ticker === currentTicker);
    if (!s) return;
    const price = s.price, pos = positions[currentTicker];
    if (tradeType === 'sell' && (!pos || shares > pos.shares)) { showToast('卖出数量超过持仓'); return; }
    trades.unshift({ ticker: currentTicker, type: tradeType, shares, price, amount: shares * price, timestamp: new Date().toISOString() });
    if (trades.length > 50) trades = trades.slice(0, 50);
    saveTrades();
    if (tradeType === 'buy') {
      if (pos) { const ns = pos.shares + shares; positions[currentTicker] = { ...pos, shares: ns, avgCost: (pos.avgCost * pos.shares + price * shares) / ns }; }
      else positions[currentTicker] = { ticker: currentTicker, shares, avgCost: price, category: s.category || 'us' };
    } else {
      const rem = pos.shares - shares;
      if (rem <= 0.001) delete positions[currentTicker];
      else positions[currentTicker] = { ...pos, shares: rem };
    }
    savePositions();
    stocks.forEach(s => { s.hasPosition = !!positions[s.ticker]; });
    $('trade-modal').classList.remove('active');
    showToast((tradeType === 'buy' ? '买入 ' : '卖出 ') + shares + ' 股 ' + currentTicker);
    renderList();
  }

        return '<div class="pos-card"><div class="pos-row"><span class="pos-ticker">' + tk + '</span><span class="pos-pnl" style="color:' + col + '">' + sg + '$' + pnl.toFixed(2) + ' (' + sg + pp.toFixed(1) + '%)</span></div><div class="pos-detail"><span>' + pos.shares + '股</span><span>均价 ' + fmtPrice(pos.avgCost) + '</span><span>现价 ' + fmtPrice(pr) + '</span></div></div>';
      }).join('');
      const tp = tv - tc, ts2 = tp >= 0 ? '+' : '', tcol = tp >= 0 ? 'var(--green)' : 'var(--red)';
      c.innerHTML = '<div style="margin-bottom:16px;padding:16px;background:var(--bg-card);border-radius:var(--radius-sm)"><div style="font-size:12px;color:var(--fg-secondary);margin-bottom:4px">总市值</div><div style="font-size:24px;font-weight:700;font-variant-numeric:tabular-nums">$' + tv.toFixed(2) + '</div><div style="font-size:14px;color:' + tcol + ';margin-top:4px">' + ts2 + '$' + tp.toFixed(2) + '</div></div>' + cards;
    } else if (menuView === 'trades') {
      t.textContent = '交易记录';
      if (!trades.length) { c.innerHTML = '<div class="empty-state">暂无交易记录</div>'; return; }
      c.innerHTML = trades.map(tr => {
        const d = new Date(tr.timestamp);
        return '<div class="log-card"><span class="log-type ' + tr.type + '">' + (tr.type === 'buy' ? '买入' : '卖出') + '</span><div class="log-info"><div class="log-ticker">' + tr.ticker + '</div><div class="log-meta">' + tr.shares + '股 @ ' + fmtPrice(tr.price) + ' · ' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0') + '</div></div><div class="log-amount">$' + (tr.amount||0).toFixed(2) + '</div></div>';
      }).join('');
    } else if (menuView === 'journal') {
      t.textContent = '交易日志';
      if (!journal.length) { c.innerHTML = '<div class="empty-state">暂无日志</div>'; return; }
      c.innerHTML = journal.map(j => '<div class="journal-card"><div class="journal-date">' + (j.date||'') + '</div><div class="journal-content">' + (j.content||'') + '</div></div>').join('');
    }
  }

  function showToast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2500); }

  $('tabs').addEventListener('click', e => { const tab = e.target.closest('.tab'); if (!tab) return; document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); currentCat = tab.dataset.cat; $('sort-bar').style.display = currentCat === 'fx' ? 'none' : 'flex'; renderList(); });
  document.querySelector('.sort-bar').addEventListener('click', e => { const btn = e.target.closest('.sort-btn'); if (!btn) return; document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); currentSort = btn.dataset.sort; renderList(); });
  $('btn-search').addEventListener('click', () => { const bar = $('search-bar'); bar.classList.toggle('active'); if (bar.classList.contains('active')) $('search-input').focus(); else { $('search-input').value = ''; searchQuery = ''; $('search-results').classList.remove('active'); renderList(); } });
  $('search-input').addEventListener('input', e => doSearch(e.target.value));
  $('search-input').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const val = e.target.value.trim().toUpperCase(); if (!val) return;
    const existing = stocks.find(s => s.ticker === val);
    if (existing) { $('search-results').classList.remove('active'); openDetail(val); }
    else { const entry = TICKER_DB.find(t => t.ticker === val); addToWatchlist(entry?.ticker || val, entry?.name || val, entry?.cat || currentCat, entry?.ex || ''); }
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search-bar')) $('search-results').classList.remove('active'); });
  $('btn-refresh').addEventListener('click', () => { refreshAllQuotes(); showToast('刷新中...'); });
  $('sheet-overlay').addEventListener('click', hideSheet);
  $('sheet-close').addEventListener('click', hideSheet);
  $('time-tabs').addEventListener('click', e => { const tab = e.target.closest('.time-tab'); if (!tab) return; document.querySelectorAll('.time-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); currentRes = tab.dataset.res; if (currentTicker) loadCandles(currentTicker); });
  $('btn-buy').addEventListener('click', () => openTrade('buy'));
  $('btn-sell').addEventListener('click', () => openTrade('sell'));
  $('trade-cancel').addEventListener('click', () => $('trade-modal').classList.remove('active'));
  $('trade-confirm').addEventListener('click', executeTrade);
  $('btn-menu').addEventListener('click', openMenu);
  $('menu-back').addEventListener('click', () => { if (menuView === 'main') closeMenu(); else { menuView = 'main'; renderMenu(); } });

  if (document.getElementById('app').style.display !== 'none') {
    init();
  }
  window.__spInit = init;
})();
</script>

</body></html>

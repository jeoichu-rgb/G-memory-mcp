<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Erik · Call</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:#060608; color:#e0e0e0; font-family:'DM Mono',monospace; font-size:14px; }

.call-screen {
  display:flex; flex-direction:column; align-items:center;
  height:100%; position:relative;
  background:
    radial-gradient(ellipse 80% 50% at 50% 30%, rgba(20,20,40,0.5) 0%, transparent 100%),
    radial-gradient(ellipse 100% 30% at 50% 100%, rgba(12,12,22,0.4) 0%, transparent 100%),
    #060608;
}

/* subtle reflection sheen at top */
.call-screen::before {
  content:''; position:absolute; top:0; left:0; right:0; height:40%;
  background:linear-gradient(180deg, rgba(255,255,255,0.015) 0%, transparent 100%);
  pointer-events:none;
}

/* ── Avatar ── */
.avatar-area { margin-top:12vh; display:flex; flex-direction:column; align-items:center; z-index:1; }

.avatar {
  width:110px; height:110px; border-radius:50%;
  background:#1a1a2e; display:flex; align-items:center; justify-content:center;
  font-size:42px; color:#c4a8ff; overflow:hidden;
  border:2px solid rgba(255,255,255,0.04);
  box-shadow:0 0 40px rgba(100,80,160,0.08);
}
.avatar img { width:100%; height:100%; object-fit:cover; }

/* mirror reflection of avatar */
.avatar-reflection {
  width:110px; height:50px; overflow:hidden;
  transform:scaleY(-1); opacity:0.1; filter:blur(3px);
  -webkit-mask-image:linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
  mask-image:linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 100%);
  margin-top:-4px; border-radius:0 0 50% 50%;
}
.avatar-reflection img { width:110px; height:110px; object-fit:cover; }

/* ── Call status & timer ── */
.call-info { margin-top:14px; text-align:center; z-index:1; }
.call-status { font-size:12px; color:rgba(255,255,255,0.4); letter-spacing:0.15em; text-transform:uppercase; }
.call-timer { font-size:15px; color:rgba(255,255,255,0.6); margin-top:3px; font-variant-numeric:tabular-nums; }

/* ── Subtitle area ── */
.subtitle-area {
  flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:0 28px; width:100%; min-height:80px; z-index:1;
}

.subtitle-original {
  font-size:16px; color:rgba(255,255,255,0.88); text-align:center;
  line-height:1.7; max-height:120px; overflow-y:auto; padding:0 8px;
  transition:opacity 0.3s;
}
.subtitle-original:empty { display:none; }

.subtitle-translation {
  font-size:12px; color:rgba(255,255,255,0.35); text-align:center;
  line-height:1.5; margin-top:8px; max-height:80px; overflow-y:auto; padding:0 8px;
}
.subtitle-translation:empty { display:none; }

/* thinking dots */
.thinking-dot { display:none; gap:6px; margin-top:16px; }
.thinking-dot.active { display:flex; }
.thinking-dot span {
  width:5px; height:5px; background:rgba(255,255,255,0.25); border-radius:50%;
  animation:tdot 1.4s ease-in-out infinite;
}
.thinking-dot span:nth-child(2) { animation-delay:0.2s; }
.thinking-dot span:nth-child(3) { animation-delay:0.4s; }
@keyframes tdot {
  0%,80%,100% { opacity:0.25; transform:scale(0.8); }
  40% { opacity:1; transform:scale(1.1); }
}

/* ── Input area ── */
.input-area {
  width:100%; padding:10px 16px; display:flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.02); border-top:1px solid rgba(255,255,255,0.04);
  z-index:1;
}
.input-area input {
  flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.07);
  border-radius:20px; padding:10px 16px; color:#e0e0e0; font-family:inherit; font-size:14px; outline:none;
}
.input-area input:focus { border-color:rgba(255,255,255,0.14); }
.input-area input::placeholder { color:rgba(255,255,255,0.2); }

.send-btn {
  width:36px; height:36px; background:rgba(255,255,255,0.08); border:none;
  border-radius:50%; color:#e0e0e0; cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:16px; transition:background 0.2s;
}
.send-btn:active { background:rgba(255,255,255,0.15); }

/* ── Controls ── */
.controls { display:flex; gap:48px; padding:16px 0 max(28px, env(safe-area-inset-bottom)); align-items:center; z-index:1; }

.ctrl-btn {
  display:flex; flex-direction:column; align-items:center; gap:5px;
  background:none; border:none; color:rgba(255,255,255,0.5); cursor:pointer;
  font-family:inherit; font-size:10px;
}
.ctrl-icon {
  width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:22px; transition:transform 0.15s;
}
.ctrl-btn:active .ctrl-icon { transform:scale(0.92); }
.hangup .ctrl-icon { background:#e53935; color:white; }

.incoming-controls {
  display:flex; gap:80px; padding:16px 0 max(28px, env(safe-area-inset-bottom));
  align-items:center; z-index:1;
}

.dial-btn {
  margin-top:16px; padding:14px 48px; border:none; border-radius:28px;
  background:#4caf50; color:white; font-size:16px; font-family:inherit;
  cursor:pointer; letter-spacing:0.1em; transition:transform 0.15s;
}
.dial-btn:active { transform:scale(0.95); }

/* ── Call record overlay ── */
.record-overlay {
  display:none; position:fixed; inset:0; background:#080808; z-index:100;
  flex-direction:column; padding:max(50px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
  overflow-y:auto;
}
.record-overlay.show { display:flex; }

.record-header { text-align:center; margin-bottom:20px; }
.record-header h2 { font-size:15px; font-weight:400; color:rgba(255,255,255,0.7); }
.record-header .dur { font-size:12px; color:rgba(255,255,255,0.35); margin-top:4px; }

.utt-list { flex:1; display:flex; flex-direction:column; gap:8px; }

.utt-item {
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; background:rgba(255,255,255,0.04); border-radius:10px;
}
.utt-play {
  width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.08);
  border:none; color:white; cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; font-size:12px;
}
.utt-play:active { background:rgba(255,255,255,0.15); }
.utt-text { flex:1; font-size:12px; color:rgba(255,255,255,0.6); line-height:1.5; }
.utt-text .tr { opacity:0.5; margin-top:2px; }
.utt-dur { font-size:11px; color:rgba(255,255,255,0.25); flex-shrink:0; }

.record-actions { margin-top:20px; }
.btn-back {
  width:100%; padding:12px; border-radius:10px; border:none;
  background:rgba(196,168,255,0.15); color:#c4a8ff;
  font-family:inherit; font-size:13px; cursor:pointer;
}
.btn-back:active { background:rgba(196,168,255,0.25); }

/* ── Waveform visualizer (during playback) ── */
.wave-bar { display:flex; align-items:center; gap:2px; height:20px; margin-top:10px; justify-content:center; }
.wave-bar.hidden { display:none; }
.wave-bar span {
  width:3px; background:rgba(196,168,255,0.4); border-radius:2px;
  animation:wbar 0.8s ease-in-out infinite alternate;
}
.wave-bar span:nth-child(1) { height:8px; animation-delay:0s; }
.wave-bar span:nth-child(2) { height:14px; animation-delay:0.1s; }
.wave-bar span:nth-child(3) { height:20px; animation-delay:0.2s; }
.wave-bar span:nth-child(4) { height:14px; animation-delay:0.3s; }
.wave-bar span:nth-child(5) { height:8px; animation-delay:0.4s; }
@keyframes wbar {
  0% { transform:scaleY(0.4); }
  100% { transform:scaleY(1); }
}
</style>
</head>
<body>

<div class="call-screen" id="callScreen">
  <div class="avatar-area">
    <div class="avatar" id="avatar">E</div>
    <div class="avatar-reflection" id="avatarRef"></div>
  </div>

  <div class="call-info">
    <div class="call-status" id="callStatus">连接中…</div>
    <div class="call-timer" id="callTimer">00:00</div>
    <button class="dial-btn" id="dialBtn" onclick="dialClick()" style="display:none;">拨号</button>
  </div>

  <div class="subtitle-area">
    <div class="subtitle-original" id="subOrig"></div>
    <div class="subtitle-translation" id="subTrans"></div>
    <div class="wave-bar hidden" id="waveBar">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="thinking-dot" id="thinkDot"><span></span><span></span><span></span></div>
  </div>

  <div class="input-area">
    <input type="text" id="msgInput" placeholder="说点什么…" autocomplete="off">
    <button class="send-btn" id="sendBtn" onclick="sendMsg()">↑</button>
  </div>

  <div class="incoming-controls" id="incomingControls" style="display:none;">
    <button class="ctrl-btn reject" onclick="rejectCall()">
      <div class="ctrl-icon" style="background:#e53935;color:white;">✕</div>
      <span>拒绝</span>
    </button>
    <button class="ctrl-btn accept" onclick="acceptCall()">
      <div class="ctrl-icon" style="background:#4caf50;color:white;">✓</div>
      <span>接听</span>
    </button>
  </div>

  <div class="controls">
    <button class="ctrl-btn hangup" onclick="hangup()">
      <div class="ctrl-icon">✕</div>
      <span>挂断</span>
    </button>
  </div>
</div>

<!-- call record overlay (after hangup) -->
<div class="record-overlay" id="recordOverlay">
  <div class="record-header">
    <h2>📞 语音通话</h2>
    <div class="dur" id="recordDur"></div>
  </div>
  <div class="utt-list" id="uttList"></div>
  <div class="record-actions">
    <button class="btn-back" onclick="goBack()">返回聊天</button>
  </div>
</div>

<script>
const WS_URL = 'wss://chat.erikssheep.uk/ws';
const API_BASE = 'https://erikssheep.uk';
const PW = localStorage.getItem('gmp_pw');
if (!PW) { location.href = '/'; }

/* ── State ── */
let ws, sessionId, callStart, timerIv;
let accumText = '', voiceEvents = [];
let utterances = [];   // {text, translation, audio_url, duration}
let audioQ = [];
let blobCache = [];  // 缓存所有 blobUrl，挂断时统一释放
let playing = false;
let callActive = false;
let playedItems = [];    // 已播完的项 {blobUrl, text, subtitle}，用于整段循环
let replayMode = false;  // 正在循环重播
let replayIdx = 0;       // 循环时播到第几个
let gapTimer = null;     // 轮间停顿定时器
let draining = false;    // 新消息来了，播完当前轮就停
const REPLAY_GAP = 3000; // 停顿 3 秒
let currentGenId = '';  // 代次隔离：只接受当前 generation 的 voice 事件
let currentPlayingText = '';  // 当前正在播放的文本，用于上报
let firstSend = true;
let isIncoming = false;
let incomingTimeout = null;

/* ── 前端 TTS 管线（通话模式：前端切句→调 /api/tts→播放）── */
let callConfig = { backend: 'elevenlabs', binaural: false, spatial_tag: '' };
let sentenceBuf = '';
let ttsQueue = [];          // [{text, subtitle}, ...]
let ttsFlying = 0;          // 当前代次正在飞行的 TTS 请求数
let ttsGenCounter = 0;      // 代次计数器（每次 sendMsg/startCall 递增）
const TTS_PREFETCH_LIMIT = 2;
const TTS_BATCH_MAX_DEFAULT = 100;
const TTS_BATCH_MAX_ELEVENLABS = 140; // ElevenLabs 用更大批次换取句间韵律连贯

const audio = new Audio();
audio.setAttribute('playsinline', '');

/* ── SFX 双音轨（背景/前景音效）── */
let sfxAudio = null;
let sfxBlobUrl = null;
let sfxMode = '';       // 'background' | 'foreground' | ''
let sfxVolume = 0.2;    // sfx 层音量设定值
let sfxFading = null;   // ducking 渐变定时器
let _sfxDuckTarget = null; // 渐变目标音量
let _sfxUnlocked = false;

/** 在用户手势中调用——预创建 sfxAudio 并做静音 play 解锁 iOS 自动播放 */
function unlockSfxAudio() {
  if (_sfxUnlocked) return;
  try {
    sfxAudio = new Audio();
    sfxAudio.setAttribute('playsinline', '');
    sfxAudio.volume = 0;
    // 极短静音 wav，触发 iOS 解锁
    sfxAudio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    var p = sfxAudio.play();  // 旧版 Safari play() 可能不返回 Promise
    if (p && typeof p.then === 'function') {
      p.then(function() {
        sfxAudio.pause();
        sfxAudio.src = '';
        sfxAudio.volume = 0.2;
        _sfxUnlocked = true;
        console.log('[sfx] iOS audio unlocked');
      }).catch(function() { _sfxUnlocked = true; });
    } else {
      _sfxUnlocked = true;
      console.log('[sfx] unlocked (no promise)');
    }
  } catch(e) {
    console.warn('[sfx] unlock failed:', e);
    _sfxUnlocked = true;  // 标记已尝试，别再重试阻塞
  }
}

function startSfx(url, mode, volume, doLoop) {
  stopSfx(true);  // 清理旧状态但保留已解锁的元素
  sfxMode = mode || 'background';
  sfxVolume = (typeof volume === 'number') ? volume : (sfxMode === 'foreground' ? 0.8 : 0.2);
  // 复用已解锁的元素，iOS 不允许在非手势链里 new Audio().play()
  if (!sfxAudio) {
    sfxAudio = new Audio();
    sfxAudio.setAttribute('playsinline', '');
  }
  sfxAudio.loop = doLoop !== false;
  sfxAudio.volume = sfxVolume;
  fetch(API_BASE + url).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.blob();
  }).then(blob => {
    if (!sfxAudio) return;  // 已被 stopSfx 清理
    sfxBlobUrl = URL.createObjectURL(blob);
    sfxAudio.src = sfxBlobUrl;
    sfxAudio.play().catch(e => console.warn('SFX play:', e));
    console.log('[sfx] started:', sfxMode, url);
  }).catch(e => console.error('[sfx] load error:', e));
}

function stopSfx(keepElement) {
  if (sfxFading) { clearInterval(sfxFading); sfxFading = null; }
  _sfxDuckTarget = null;
  if (sfxAudio) {
    sfxAudio.pause();
    sfxAudio.src = '';
    if (!keepElement) { sfxAudio = null; _sfxUnlocked = false; }
  }
  if (sfxBlobUrl) { URL.revokeObjectURL(sfxBlobUrl); sfxBlobUrl = null; }
  sfxMode = '';
  // foreground 模式下 voice 音量可能被降低，恢复
  audio.volume = 1.0;
}

function duckSfx(voicePlaying) {
  if (!sfxAudio || !sfxMode) return;
  let targetVol, targetVoice = 1.0;
  if (sfxMode === 'background') {
    targetVol = voicePlaying ? sfxVolume * 0.35 : sfxVolume;
  } else if (sfxMode === 'foreground') {
    targetVol = voicePlaying ? sfxVolume * 0.55 : sfxVolume;
    targetVoice = voicePlaying ? 0.45 : 1.0;
  } else return;
  _sfxDuckTarget = targetVol;
  // 平滑渐变：~200ms 过渡，每 16ms 一步
  if (sfxFading) { clearInterval(sfxFading); sfxFading = null; }
  const steps = 12;  // 12 × 16ms ≈ 200ms
  const startVol = sfxAudio.volume;
  const startVoice = audio.volume;
  const dVol = (targetVol - startVol) / steps;
  const dVoice = (targetVoice - startVoice) / steps;
  let step = 0;
  if (Math.abs(dVol) < 0.001 && Math.abs(dVoice) < 0.001) return;
  sfxFading = setInterval(() => {
    step++;
    if (step >= steps) {
      sfxAudio.volume = targetVol;
      audio.volume = targetVoice;
      clearInterval(sfxFading); sfxFading = null;
    } else {
      sfxAudio.volume = startVol + dVol * step;
      if (sfxMode === 'foreground') audio.volume = startVoice + dVoice * step;
    }
  }, 16);
}

/* ── Init ── */
(function init() {
  const p = new URLSearchParams(location.search);
  sessionId = p.get('session') || localStorage.getItem('last-session-id');
  if (!sessionId) { location.href = '/chat.html'; return; }
  isIncoming = p.get('incoming') === 'true';

  const av = localStorage.getItem('erik-avatar');
  if (av) {
    document.getElementById('avatar').innerHTML = '<img src="' + av + '">';
    document.getElementById('avatarRef').innerHTML = '<img src="' + av + '">';
  }

  document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) sendMsg();
  });

  if (isIncoming) {
    setStatus('来电');
    document.getElementById('dialBtn').style.display = 'none';
    document.getElementById('incomingControls').style.display = 'flex';
    document.querySelector('.controls').style.display = 'none';
    document.querySelector('.input-area').style.display = 'none';
    incomingTimeout = setTimeout(() => rejectCall('timeout'), 180000);
  }

  connectWS();
})();

/* ── WS ── */
function connectWS() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    wsSend('session:switch', { sessionId });
    if (callActive) {
      // 断线重连：请求恢复未送达的音频
      wsSend('call:reconnect', { sessionId, generation_id: currentGenId });
      setStatus('重连中……');
      setTimeout(() => { if (callActive && !playing) setStatus('通话中'); }, 3000);
    } else if (!isIncoming) {
      setStatus('等待拨号');
      document.getElementById('dialBtn').style.display = '';
    }
  };
  ws.onmessage = e => {
    try { handleWS(JSON.parse(e.data)); } catch(err) { console.warn('[ws]', err); }
  };
  ws.onclose = () => { if (callActive) setTimeout(connectWS, 2000); };
}

function wsSend(ev, data) {
  if (ws?.readyState === 1) ws.send(JSON.stringify({ event: ev, ...data }));
}

/* ── Dial (user gesture unlocks audio) ── */
function dialClick() {
  document.getElementById('dialBtn').style.display = 'none';
  // user gesture → unlock audio (voice + sfx)
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = ctx.createBuffer(1, 1, 22050);
  const s = ctx.createBufferSource();
  s.buffer = buf; s.connect(ctx.destination); s.start();
  audio.play().then(() => audio.pause()).catch(() => {});
  unlockSfxAudio();
  startCall();
}

/* ── Incoming call: accept / reject ── */
function acceptCall() {
  if (incomingTimeout) { clearTimeout(incomingTimeout); incomingTimeout = null; }
  document.getElementById('incomingControls').style.display = 'none';
  document.querySelector('.controls').style.display = 'flex';
  document.querySelector('.input-area').style.display = 'flex';

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const buf = ctx.createBuffer(1, 1, 22050);
  const s = ctx.createBufferSource();
  s.buffer = buf; s.connect(ctx.destination); s.start();
  audio.play().then(() => audio.pause()).catch(() => {});
  unlockSfxAudio();

  callActive = true;
  callStart = Date.now();
  timerIv = setInterval(tickTimer, 1000);
  setStatus('通话中');
  showThinking(true);
  resetTtsPipeline();

  wsSend('call:accept', { sessionId });
}

function rejectCall(reason) {
  if (incomingTimeout) { clearTimeout(incomingTimeout); incomingTimeout = null; }
  wsSend('call:reject', { sessionId, reason: reason || 'rejected' });
  location.href = '/';
}

/* ── Call lifecycle ── */
function startCall() {
  callActive = true;
  callStart = Date.now();
  timerIv = setInterval(tickTimer, 1000);
  setStatus('通话中');
  resetTtsPipeline();

  wsSend('chat:send', {
    message: '📞',
    sessionId,
    call_mode: true,
  });
  showThinking(true);
}

function tickTimer() {
  const s = Math.floor((Date.now() - callStart) / 1000);
  document.getElementById('callTimer').textContent =
    String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}

/* ── Send ── */
function sendMsg() {
  const inp = document.getElementById('msgInput');
  const txt = inp.value.trim();
  if (!txt) return;
  inp.value = '';

  // 新一轮对话：清空旧代次
  currentGenId = '';
  audioQ = [];
  resetTtsPipeline();

  if (gapTimer) {
    // 在轮间停顿 → 取消停顿，直接切
    clearTimeout(gapTimer); gapTimer = null;
    endReplay();
  } else if (playing || replayMode) {
    // 正在播当前这句 → 让它自然播完，播完后立刻切新 TTS（不等 gap）
    draining = true;
  } else {
    playedItems = [];
    setSub('', '');
  }

  wsSend('chat:send', { message: txt, sessionId, call_mode: true });
  showThinking(true);
}

/* ── Receive ── */
function handleWS(d) {
  switch (d.event || d.type || '') {
    case 'stream:text':
      accumText += d.text || '';
      if (callActive) enqueueSentences(d.text || '');
      break;
    case 'stream:thinking':
      break;
    case 'stream:block':
      if (d.block && d.block.name && d.block.name.includes('speak')) {
        setStatus('说话中……');
        showThinking(false);
      }
      break;
    case 'voice':
      if (!callActive) break;
      // 代次隔离：记住第一个 generation_id，丢弃旧代次
      if (d.generation_id) {
        if (!currentGenId) currentGenId = d.generation_id;
        if (d.generation_id !== currentGenId) break;
      }
      voiceEvents.push({ audio_url: d.audio_url, duration: d.duration, text: d.text, subtitle: d.subtitle || '' });
      setStatus('说话中……');
      showThinking(false);
      enqueueAudio(API_BASE + d.audio_url, d.text, d.subtitle || '');
      break;
    case 'call:backend_switch':
      if (callActive) {
        setStatus('TTS已切换到 ' + (d.to === 'minimax' ? 'MiniMax（云端）' : 'Local'));
        setTimeout(() => { if (callActive) setStatus('通话中'); }, 4000);
      }
      break;
    case 'call:sfx':
      if (!callActive) break;
      if (d.action === 'start') {
        startSfx(d.audio_url, d.mode, d.volume, d.loop);
        duckSfx(playing);  // 如果正在播放 voice，立即 duck
      } else if (d.action === 'stop') {
        stopSfx();
      } else if (d.action === 'restore') {
        // 断线恢复：后端下发之前的 sfx 状态
        if (d.sfx_state && d.sfx_state.audio_url) {
          startSfx(d.sfx_state.audio_url, d.sfx_state.mode, d.sfx_state.volume, d.sfx_state.loop);
          duckSfx(playing);
        }
      }
      break;
    case 'call:config':
      callConfig.backend = d.backend || 'elevenlabs';
      callConfig.binaural = !!d.binaural;
      callConfig.spatial_tag = d.spatial_tag || '';
      console.log('[call:config]', callConfig);
      break;
    case 'call:binaural':
      // 时序保护：先 flush 旧配置的待发文本，再更新配置
      if (callActive) flushSentenceBuf();
      callConfig.binaural = !!d.enabled;
      callConfig.spatial_tag = d.tag || '';
      console.log('[binaural]', d.enabled ? 'on' : 'off', d.tag || '');
      break;
    case 'message:complete':
      onReplyDone();
      break;
    case 'session:created':
      sessionId = d.sessionId;
      break;
    case 'ping':
      wsSend('pong', {});
      break;
  }
}

async function onReplyDone() {
  showThinking(false);

  // parse voice markers (erik_speak MCP calls — non-call mode fallback)
  const vRe = /<!--voice:(.+?)\|(.+?)\|(.+?)-->/g;
  let m;
  while ((m = vRe.exec(accumText)) !== null) {
    const url = m[1];
    if (!voiceEvents.some(v => v.audio_url === url)) {
      voiceEvents.push({ audio_url: url, duration: parseFloat(m[2]), text: m[3] });
      if (!callActive) enqueueAudio(API_BASE + url, m[3], '');
    }
  }
  let cleanText = accumText.replace(vRe, '').replace(/<!--(?:react|curiosity)[^>]*-->/g, '').trim();

  if (callActive) {
    // 通话模式：flush 剩余句子进前端 TTS 管线
    console.log('[tts-pipe] replyDone → flush remaining');
    flushSentenceBuf();
  } else if (voiceEvents.length > 0) {
    // 非通话：voice 事件（erik_speak）走旧路径
    for (const v of voiceEvents) {
      if (!utterances.some(u => u.audio_url === v.audio_url)) {
        utterances.push({ text: v.text, translation: cleanText, audio_url: v.audio_url, duration: v.duration });
      }
    }
  }

  accumText = '';
  voiceEvents = [];
}

/* ── 前端句子切分（移植自 gateway._split_sentences_skip_parens）── */
function splitSentences(text) {
  const sents = [];
  let cur = '';
  let depth = 0;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    cur += ch;
    if (ch === '（' || ch === '(') {
      depth++;
    } else if (ch === '）' || ch === ')') {
      depth = Math.max(0, depth - 1);
      if (depth === 0) { sents.push(cur); cur = ''; }
    } else if (depth === 0 && '。！？.!?\n'.includes(ch)) {
      let j = i + 1;
      while (j < text.length && ' \t'.includes(text[j])) j++;
      if (j < text.length && (text[j] === '（' || text[j] === '(')) {
        /* 句末标点后紧跟括号 → 不切，等括号闭合 */
      } else {
        sents.push(cur); cur = '';
      }
    }
  }
  if (cur) sents.push(cur);
  return sents;
}

const _PAREN_RE = /[（(][^)）]*[)）]/g;
function cleanTtsText(text) {
  return text
    .replace(/```[\s\S]*?```/g, '')         // 代码块
    .replace(/`[^`]+`/g, '')                // 行内代码
    .replace(/!\[[^\]]*\]\([^)]*\)/g, '')   // 图片
    .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1') // 链接 → 保留文字
    .replace(/^#{1,6}\s+/gm, '')            // 标题符号
    .replace(/\*{1,3}([^*]+)\*{1,3}/g, '$1') // **加粗** *斜体*
    .replace(/_{1,3}([^_]+)_{1,3}/g, '$1')  // __加粗__ _斜体_
    .replace(/^[\s]*[-*+]\s+/gm, '')        // 列表符号
    .replace(/^[\s]*\d+\.\s+/gm, '')        // 有序列表
    .replace(/\*([^*]+)\*/g, '$1')          // 残余星号动作 *叹气*
    .replace(/[✅❌⚠️🔥💡📌🎯🚀⭐️📝💬🔗📎🗂️📊📈📉🛠️⚙️🔧📚🎓🏆🎪🎨🎭]/g, '') // 工具/装饰 emoji
    .trim();
}
function extractTtsAndSubtitle(text) {
  const parens = text.match(_PAREN_RE) || [];
  const ttsText = cleanTtsText(text.replace(_PAREN_RE, '')).trim();
  const subtitle = parens.map(p => p.slice(1, -1)).join(' ');
  return [ttsText, subtitle];
}

function getTtsBatchMax() {
  return callConfig.backend === 'elevenlabs' ? TTS_BATCH_MAX_ELEVENLABS : TTS_BATCH_MAX_DEFAULT;
}

function splitLong(text, limit) {
  limit = limit || getTtsBatchMax();
  if (text.length <= limit) return [text];
  const chunks = [];
  let buf = '';
  for (const ch of text) {
    buf += ch;
    if ('，,；;、'.includes(ch) && buf.length >= 20) { chunks.push(buf); buf = ''; }
  }
  if (buf) {
    if (chunks.length && buf.length < 10) chunks[chunks.length - 1] += buf;
    else chunks.push(buf);
  }
  return chunks;
}

/* ── 前端 TTS 管线 ── */
function resetTtsPipeline() {
  sentenceBuf = '';
  ttsQueue = [];
  ttsGenCounter++;
  ttsFlying = 0;
  console.log('[tts-pipe] reset, gen=' + ttsGenCounter);
}

function enqueueSentences(text) {
  sentenceBuf += text;
  const parts = splitSentences(sentenceBuf);
  if (parts.length > 1) {
    for (let i = 0; i < parts.length - 1; i++) {
      const sent = parts[i].trim();
      if (!sent) continue;
      for (const chunk of splitLong(sent)) {
        const [ttsText, subtitle] = extractTtsAndSubtitle(chunk);
        if (ttsText) {
          ttsQueue.push({ text: ttsText, subtitle });
          console.log('[tts-pipe] enqueue: ' + ttsText.slice(0, 40) + (subtitle ? ' (' + subtitle.slice(0, 20) + ')' : ''));
        }
      }
    }
    sentenceBuf = parts[parts.length - 1];
  }
  pumpTtsQueue();
}

function flushSentenceBuf() {
  const buf = sentenceBuf.trim();
  sentenceBuf = '';
  if (!buf) { console.log('[tts-pipe] flush: empty'); return; }
  console.log('[tts-pipe] flush: ' + buf.slice(0, 50));
  for (const chunk of splitLong(buf)) {
    const [ttsText, subtitle] = extractTtsAndSubtitle(chunk);
    if (ttsText) ttsQueue.push({ text: ttsText, subtitle });
  }
  pumpTtsQueue();
}

function pumpTtsQueue() {
  while (ttsQueue.length > 0 && ttsFlying < TTS_PREFETCH_LIMIT) {
    const item = ttsQueue.shift();
    const myGen = ttsGenCounter;
    ttsFlying++;
    console.log('[tts-pipe] → /api/tts gen=' + myGen + ' flying=' + ttsFlying + ' q=' + ttsQueue.length + ' | ' + item.text.slice(0, 30));
    callTTS(item.text).then(r => {
      if (myGen !== ttsGenCounter) { console.log('[tts-pipe] discard stale gen=' + myGen); return; }
      ttsFlying--;
      console.log('[tts-pipe] ✓ ' + r.audio_url + ' (' + r.duration + 's) flying=' + ttsFlying);
      utterances.push({ text: item.text, translation: item.subtitle,
                         audio_url: r.audio_url, duration: r.duration });
      enqueueAudio(API_BASE + r.audio_url, item.text, item.subtitle);
      pumpTtsQueue();
    }).catch(err => {
      if (myGen !== ttsGenCounter) return;
      ttsFlying--;
      console.error('[tts-pipe] ✗ flying=' + ttsFlying, err);
      pumpTtsQueue();
    });
  }
}

/* ── TTS API ── */
async function callTTS(text) {
  const payload = { text, backend: callConfig.backend, speed: 1.0 };
  if (callConfig.binaural) {
    payload.binaural = true;
    if (callConfig.spatial_tag) payload.spatial_tag = callConfig.spatial_tag;
  }
  const r = await fetch(API_BASE + '/api/tts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-secret': PW },
    body: JSON.stringify(payload),
  });
  if (!r.ok) {
    const body = await r.json().catch(() => ({}));
    const errMsg = body.error || ('TTS ' + r.status);
    // fallback: elevenlabs/local → minimax
    if (callConfig.backend !== 'minimax') {
      const oldBackend = callConfig.backend;
      callConfig.backend = 'minimax';
      console.warn('[tts] ' + oldBackend + ' failed (' + errMsg + '), fallback → minimax');
      wsSend('call:tts_error', { backend: oldBackend, error: errMsg, text: text.slice(0, 80) });
      return callTTS(text);
    }
    throw new Error(errMsg);
  }
  return r.json();
}

/* ── Replay (整段循环) ── */
function startGap(cb) {
  playing = false;
  showWave(false);
  setStatus('通话中');
  // BGM 平滑恢复（duckSfx 内部会做 200ms 渐变）
  duckSfx(false);
  gapTimer = setTimeout(() => { gapTimer = null; cb(); }, REPLAY_GAP);
}

/** draining 时跳过 gap，立刻结束 replay */
function immediateEndReplay() {
  if (gapTimer) { clearTimeout(gapTimer); gapTimer = null; }
  endReplay();
}

function startReplay() {
  if (!playedItems.length || !callActive) return;
  replayMode = true;
  replayIdx = 0;
  playReplayItem();
}

function playReplayItem() {
  // draining 立刻停，不继续播 replay
  if (draining) { immediateEndReplay(); return; }
  if (replayIdx >= playedItems.length) {
    // 一轮结束 → 停顿后重头
    startGap(() => { replayIdx = 0; playReplayItem(); });
    return;
  }
  const item = playedItems[replayIdx];
  playing = true;
  currentPlayingText = '';  // replay 不发 call:heard
  showWave(true);
  setStatus('说话中……');
  setSub(item.text, item.subtitle);
  duckSfx(true);
  audio.src = item.blobUrl;
  audio.oncanplaythrough = () => {
    audio.oncanplaythrough = null;
    audio.play().catch(() => { replayIdx++; playReplayItem(); });
  };
  audio.onerror = () => { replayIdx++; playReplayItem(); };
  audio.load();
}

function endReplay() {
  replayMode = false;
  replayIdx = 0;
  draining = false;
  playedItems = [];
  playing = false;
  showWave(false);
  duckSfx(false);
  if (audioQ.length) {
    playNext();
  } else {
    setStatus('通话中');
    setSub('', '');
  }
}

/* ── Audio queue ── */
function enqueueAudio(url, text, subtitle) {
  const item = {url, text: text || '', subtitle: subtitle || '', blobUrl: null, ready: false, error: false};
  audioQ.push(item);
  fetch(url).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.blob();
  }).then(blob => {
    item.blobUrl = URL.createObjectURL(blob);
    blobCache.push(item.blobUrl);
    item.ready = true;
    if (!playing && !gapTimer && !replayMode) playNext();
  }).catch(err => {
    console.error('preload error:', url, err);
    item.error = true;
    if (!playing) playNext();
  });
  if (!playing) playNext();
}

function playNext() {
  while (audioQ.length && audioQ[0].error) audioQ.shift();
  if (!audioQ.length) {
    playing = false; showWave(false); duckSfx(false);
    if (playedItems.length && callActive) {
      if (draining) {
        // 第一轮播完，新消息来了 → 立刻切，不等 gap
        immediateEndReplay();
      } else {
        // 正常播完 → 停顿后整段循环
        startGap(() => startReplay());
      }
    } else {
      setStatus('通话中');
    }
    return;
  }
  const item = audioQ[0];
  if (!item.ready) { playing = false; duckSfx(false); return; }
  audioQ.shift();
  // 存到已播列表，循环时用
  playedItems.push({blobUrl: item.blobUrl, text: item.text, subtitle: item.subtitle});
  playing = true;
  currentPlayingText = item.text;
  showWave(true);
  setStatus('说话中……');
  setSub(item.text, item.subtitle);
  duckSfx(true);
  audio.src = item.blobUrl;
  audio.oncanplaythrough = () => {
    audio.oncanplaythrough = null;
    audio.play().catch(err => {
      console.error('play failed:', err);
      playNext();
    });
  };
  audio.onerror = () => { console.error('audio play error'); playNext(); };
  audio.load();
}
audio.addEventListener('ended', () => {
  if (replayMode) {
    replayIdx++;
    // draining 立刻停；否则继续下一条
    if (draining) { immediateEndReplay(); }
    else { playReplayItem(); }  // playReplayItem 内部处理轮结束
    return;
  }
  // 正常播放
  if (currentPlayingText) wsSend('call:heard', { sessionId, text: currentPlayingText, status: 'completed' });
  duckSfx(false);
  playNext();
});
audio.addEventListener('error', () => {
  if (replayMode) {
    replayIdx++;
    if (draining) { immediateEndReplay(); }
    else { playReplayItem(); }
    return;
  }
  if (currentPlayingText) wsSend('call:heard', { sessionId, text: currentPlayingText, status: 'error', position: audio.currentTime || 0 });
  duckSfx(false);
  playNext();
});

/* ── UI helpers ── */
function setSub(orig, trans) {
  document.getElementById('subOrig').textContent = orig;
  document.getElementById('subTrans').textContent = trans;
}
function showThinking(on) { document.getElementById('thinkDot').classList.toggle('active', on); }
function setStatus(txt) { document.getElementById('callStatus').textContent = txt; }
function showWave(on) { document.getElementById('waveBar').classList.toggle('hidden', !on); }

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ── Hangup ── */
function hangup() {
  callActive = false;
  draining = false;
  replayMode = false;
  replayIdx = 0;
  playedItems = [];
  if (gapTimer) { clearTimeout(gapTimer); gapTimer = null; }
  clearInterval(timerIv);
  audio.pause();
  audioQ = [];
  stopSfx();  // 停止背景/前景音效
  // 释放所有缓存的 blob URL
  for (const b of blobCache) URL.revokeObjectURL(b);
  blobCache = [];

  // stop TTS worker immediately (HTTP bypasses WS event queue)
  fetch(WS_URL.replace('wss://', 'https://').replace('/ws', '') + '/internal/call-stop', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId }),
  }).catch(() => {});

  const dur = Math.floor((Date.now() - callStart) / 1000);

  // save call record to chat history
  wsSend('call:end', { sessionId, duration: dur, utterances });

  showRecord(dur);
}

function showRecord(dur) {
  const mm = Math.floor(dur/60), ss = dur%60;
  document.getElementById('recordDur').textContent = mm + '分' + String(ss).padStart(2,'0') + '秒';

  const list = document.getElementById('uttList');
  list.innerHTML = '';
  for (const u of utterances) {
    const div = document.createElement('div');
    div.className = 'utt-item';
    const durStr = u.duration >= 60
      ? Math.floor(u.duration/60) + ':' + String(Math.round(u.duration%60)).padStart(2,'0')
      : '0:' + String(Math.round(u.duration)).padStart(2,'0');
    div.innerHTML =
      '<button class="utt-play" data-url="' + esc(API_BASE + u.audio_url) + '" onclick="playUtt(this)">▶</button>' +
      '<div class="utt-text">' + esc(u.text) +
        (u.translation ? '<div class="tr">' + esc(u.translation) + '</div>' : '') +
      '</div>' +
      '<div class="utt-dur">' + durStr + '</div>';
    list.appendChild(div);
  }

  if (!utterances.length) {
    list.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.25);padding:20px">无语音记录</div>';
  }

  document.getElementById('callScreen').style.display = 'none';
  document.getElementById('recordOverlay').classList.add('show');
}

function playUtt(btn) {
  audio.src = btn.dataset.url;
  audio.play().catch(err => console.error(err));
}

function goBack() {
  location.href = '/';
}
</script>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ── Variables ── */
:root{
  --white:#f0f0f0;--wh:rgba(255,255,255,.92);
  --dim:rgba(255,255,255,.45);--muted:rgba(255,255,255,.15);
  --red:#ff2d55;--vip:#d4a853;
  --mono:'DM Mono','Consolas',monospace;
  --serif:'Lora',Georgia,serif;
  --vs:min(300px,72vw);
}

/* ── Reset ── */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#000;}
body{color:var(--wh);font-family:var(--mono);font-size:13px;position:relative;}

/* ── Background blur ── */
.bg{position:fixed;inset:-40px;z-index:0;overflow:hidden;}
.bg img{width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;
  filter:blur(44px) brightness(.25) saturate(1.5);transition:opacity .8s;}
.bg::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35);}
.bg-empty{background:radial-gradient(ellipse at 50% 40%,#161b26,#0a0d14);}

/* ── Header ── */
header{position:fixed;top:0;left:0;right:0;z-index:30;
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px;pointer-events:none;}
header>*{pointer-events:auto;}
.btn-icon{background:none;border:none;color:var(--dim);cursor:pointer;
  padding:8px;display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:background .15s;}
.btn-icon:active{background:rgba(255,255,255,.08);}
.btn-icon svg{width:21px;height:21px;}

/* ── Player Area ── */
.player-area{position:fixed;top:0;bottom:0;left:0;right:0;z-index:10;}
.page{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  transition:opacity .35s ease,visibility .35s;}
.page.out{opacity:0;visibility:hidden;pointer-events:none;}

/* ── Vinyl Page ── */
.page-vinyl{padding:0 0 260px;justify-content:center;}

.vinyl-container{position:relative;width:var(--vs);height:var(--vs);flex-shrink:0;}

/* Tonearm (CSS-only) */
.tonearm{position:absolute;top:-14px;right:6px;z-index:3;
  width:3px;height:calc(var(--vs) * .5);
  background:linear-gradient(to bottom,#d0d0d0,#a0a0a0);
  border-radius:1.5px;
  transform-origin:center 7px;
  transform:rotate(-8deg);
  transition:transform .6s cubic-bezier(.4,0,.2,1);}
.tonearm::before{content:'';position:absolute;top:-5px;left:50%;
  transform:translateX(-50%);width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle,#c8c8c8 30%,#909090);
  box-shadow:0 1px 4px rgba(0,0,0,.4);}
.tonearm::after{content:'';position:absolute;bottom:-2px;left:50%;
  transform:translateX(-50%);width:7px;height:9px;
  background:#777;border-radius:0 0 2px 2px;}
.tonearm.on{transform:rotate(-32deg);}

/* Vinyl Record */
.vinyl{width:100%;height:100%;border-radius:50%;position:relative;
  background:
    radial-gradient(circle,transparent 18.5%,rgba(30,40,60,.6) 19%,transparent 19.5%),
    radial-gradient(circle,transparent 27%,rgba(30,40,60,.4) 27.3%,transparent 27.6%),
    radial-gradient(circle,transparent 35%,rgba(30,40,60,.3) 35.2%,transparent 35.5%),
    radial-gradient(circle,transparent 43%,rgba(30,40,60,.25) 43.2%,transparent 43.4%),
    radial-gradient(circle,transparent 51%,rgba(30,40,60,.2) 51.2%,transparent 51.4%),
    radial-gradient(circle,transparent 59%,rgba(30,40,60,.18) 59.2%,transparent 59.4%),
    radial-gradient(circle,transparent 67%,rgba(30,40,60,.15) 67.2%,transparent 67.4%),
    radial-gradient(circle,transparent 75%,rgba(30,40,60,.12) 75.2%,transparent 75.4%),
    radial-gradient(circle,transparent 83%,rgba(30,40,60,.1) 83.2%,transparent 83.4%),
    radial-gradient(circle,transparent 91%,rgba(30,40,60,.08) 91.2%,transparent 91.4%),
    radial-gradient(circle,#0f1318 18%,#12171f 50%,#0d1117 100%);
  box-shadow:0 0 60px rgba(0,0,0,.5),0 0 120px rgba(180,160,220,.08),inset 0 0 25px rgba(0,0,0,.3);
  animation:spin 3.6s linear infinite;animation-play-state:paused;}
.vinyl.spinning{animation-play-state:running;}
.vinyl::after{content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1px solid rgba(255,255,255,.06);
  box-shadow:0 0 30px rgba(200,190,240,.1),0 0 60px rgba(200,190,240,.05);
  pointer-events:none;}
.vinyl-cover{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:62%;height:62%;border-radius:50%;object-fit:cover;
  background:#181c24;box-shadow:0 0 20px rgba(0,0,0,.4);}
.vinyl-cover:not([src]),.vinyl-cover[src=""]{opacity:0;}
.vinyl-hole{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:4%;height:4%;border-radius:50%;background:#0a0d14;
  box-shadow:inset 0 0 2px rgba(0,0,0,.8);z-index:2;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ── Spectrum Ring ── */
#spectrum-canvas{position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);pointer-events:none;}
.vinyl-container.spectrum-on .vinyl::after{
  box-shadow:none;border-color:transparent;
  transition:box-shadow .4s,border-color .4s;}

/* Song Info (inside dock) */
.song-info{padding:0 0 10px;width:100%;}
.song-title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.song-title-left{display:flex;align-items:center;gap:8px;min-width:0;flex:1;}
.song-title{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  font-size:22px;font-weight:600;color:var(--wh);letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.vip-badge{font-size:9px;padding:1px 5px;border:1px solid var(--vip);
  color:var(--vip);border-radius:3px;letter-spacing:.04em;flex-shrink:0;line-height:1.4;}
.vip-badge.hidden{display:none;}
.song-artist{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  font-size:15px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Like Button */
.btn-like{background:none;border:none;cursor:pointer;padding:8px;
  display:inline-flex;flex-shrink:0;}
.btn-like svg{width:22px;height:22px;transition:all .25s;}
.btn-like .heart-outline{color:var(--dim);}
.btn-like .heart-fill{color:var(--red);display:none;}
.btn-like.liked .heart-outline{display:none;}
.btn-like.liked .heart-fill{display:block;}

/* ── Lyrics Page ── */
.page-lyric{padding:48px 0 180px;}
.lyrics-scroll{width:100%;height:100%;overflow-y:auto;padding:0 28px;
  mask-image:linear-gradient(transparent 4%,#000 14%,#000 86%,transparent 96%);
  -webkit-mask-image:linear-gradient(transparent 4%,#000 14%,#000 86%,transparent 96%);
  scroll-behavior:smooth;}
.lyrics-scroll::-webkit-scrollbar{width:0;}
.lyric-spacer-top{height:38vh;}
.lyric-spacer-bot{height:50vh;}
.lyric-line{font-family:-apple-system,'SF Pro Display','Helvetica Neue','PingFang SC',sans-serif;
  font-size:26px;font-weight:700;line-height:1.45;letter-spacing:-.01em;
  color:rgba(255,255,255,.28);transition:color .4s,transform .35s,text-shadow .4s;
  padding:2px 0;margin:6px 0 0;cursor:default;}
.lyric-line.active{color:var(--wh);transform:scale(1.02);transform-origin:left center;
  text-shadow:0 0 18px rgba(255,255,255,.1);}
.lyric-line.near{color:rgba(255,255,255,.45);}
.lyric-trans{font-family:-apple-system,'SF Pro Display','Helvetica Neue','PingFang SC',sans-serif;
  font-size:14px;font-weight:500;color:rgba(255,255,255,.18);
  margin:0 0 4px;padding:0;cursor:default;}
.lyric-placeholder{font-size:13px;color:var(--dim);font-style:italic;
  text-align:center;padding-top:36vh;}

/* ── Footer Dock ── */
footer{position:fixed;bottom:0;left:0;right:0;z-index:20;
  padding:0 24px calc(env(safe-area-inset-bottom,12px) + 8px);
  background:linear-gradient(transparent,rgba(0,0,0,.55) 28%);}
.dock-inner{transition:max-height .4s cubic-bezier(.32,.72,.24,1),opacity .3s;
  max-height:300px;opacity:1;overflow:hidden;}
footer.collapsed .dock-inner{max-height:0;opacity:0;}
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.time{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;
  color:var(--dim);min-width:36px;letter-spacing:-.02em;}
.time:last-child{text-align:right;}
.progress-track{flex:1;height:4px;background:var(--muted);border-radius:2px;
  position:relative;cursor:pointer;touch-action:none;}
.progress-fill{height:100%;background:rgba(255,255,255,.55);border-radius:2px;
  transition:width .15s linear;pointer-events:none;}
.progress-track:active .progress-fill{background:var(--wh);}
.controls{display:flex;justify-content:center;align-items:center;gap:52px;
  padding:18px 0 14px;}
.btn-ctrl{background:none;border:none;color:var(--wh);cursor:pointer;
  padding:8px;display:flex;align-items:center;justify-content:center;
  opacity:.9;transition:opacity .15s;}
.btn-ctrl:active{opacity:.5;}
.btn-ctrl:disabled{opacity:.2;cursor:default;}
.btn-ctrl svg{width:32px;height:32px;}
.btn-play svg{width:52px;height:52px;}
.btn-play .icon-pause{display:none;}
.btn-play.playing .icon-play{display:none;}
.btn-play.playing .icon-pause{display:block;}
.toolbar{display:flex;justify-content:space-between;align-items:center;
  padding:6px 4px 2px;}
.toolbar-left{display:flex;align-items:center;}
.toolbar-right{display:flex;align-items:center;gap:6px;}
.btn-tool{background:none;border:none;color:var(--dim);cursor:pointer;
  padding:10px;display:flex;align-items:center;justify-content:center;
  transition:color .15s;}
.btn-tool:active{opacity:.5;}
.btn-tool svg{width:22px;height:22px;}
.btn-tool.active{color:var(--wh);}

/* ── Playlist Menu ── */
.playlist-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);
  display:flex;flex-direction:column;
  transition:opacity .2s,visibility .2s;}
.playlist-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.pl-header{display:flex;align-items:center;gap:12px;padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;}
.pl-back{background:none;border:none;color:var(--red);cursor:pointer;
  padding:4px;display:flex;align-items:center;font-size:0;}
.pl-back svg{width:22px;height:22px;}
.pl-header-title{flex:1;font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  font-size:17px;font-weight:600;color:var(--wh);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-header-spacer{width:30px;flex-shrink:0;}
.playlist-menu-list{flex:1;overflow-y:auto;padding:4px 0;}
.playlist-item{display:flex;align-items:center;gap:14px;padding:10px 20px;cursor:pointer;
  transition:background .1s;}
.playlist-item:active{background:rgba(255,255,255,.04);}
.playlist-item.current .pi-name{color:var(--red);}
.pi-cover{width:52px;height:52px;border-radius:6px;object-fit:cover;background:#1a1d24;flex-shrink:0;}
.pi-name{flex:1;font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  font-size:15px;font-weight:500;color:var(--wh);min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pi-count{font-size:12px;color:var(--dim);flex-shrink:0;
  font-family:-apple-system,'Helvetica Neue',sans-serif;}
/* Song list inside playlist detail */
.song-item{display:flex;align-items:center;gap:14px;padding:10px 20px;cursor:pointer;
  transition:background .1s;}
.song-item:active{background:rgba(255,255,255,.04);}
.song-item.playing .si2-name{color:var(--red);}
.si2-cover{width:48px;height:48px;border-radius:5px;object-fit:cover;background:#1a1d24;flex-shrink:0;}
.si2-info{flex:1;min-width:0;}
.si2-name{font-family:-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;
  font-size:15px;font-weight:500;color:var(--wh);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;}
.si2-artist{font-family:-apple-system,'Helvetica Neue',sans-serif;
  font-size:12px;color:var(--dim);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── Search Overlay ── */
.search-overlay{position:fixed;inset:0;z-index:100;background:rgba(6,8,14,.94);
  display:flex;flex-direction:column;
  transition:opacity .2s,visibility .2s;}
.search-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.search-hd{display:flex;align-items:center;gap:8px;
  padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.06);}
.search-hd input{flex:1;background:rgba(255,255,255,.07);border:none;
  color:var(--wh);font-family:var(--mono);font-size:14px;
  padding:10px 14px;border-radius:8px;outline:none;}
.search-hd input::placeholder{color:rgba(255,255,255,.22);}
.btn-text{background:none;border:none;color:var(--dim);
  font-family:var(--mono);font-size:13px;cursor:pointer;padding:8px;}
.search-results{flex:1;overflow-y:auto;padding:4px 0;}
.search-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;
  transition:background .1s;}
.search-item:active{background:rgba(255,255,255,.04);}
.si-cover{width:44px;height:44px;border-radius:4px;object-fit:cover;background:#1a1d24;flex-shrink:0;}
.si-info{flex:1;min-width:0;}
.si-title{font-size:14px;color:var(--wh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;}
.si-sub{font-size:11px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.si-dur{font-size:11px;color:rgba(255,255,255,.22);flex-shrink:0;font-variant-numeric:tabular-nums;}
.si-vip{font-size:8px;padding:1px 4px;border:1px solid var(--vip);color:var(--vip);border-radius:2px;flex-shrink:0;}
.search-empty{text-align:center;padding:60px 20px;color:var(--dim);font-size:12px;font-style:italic;}

/* ── Share Menu ── */
.share-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;justify-content:center;
  transition:opacity .2s,visibility .2s;}
.share-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}
.share-menu{width:100%;max-width:420px;background:#1c1c1e;
  border-radius:14px 14px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom,12px) + 8px);}
.share-option{display:flex;align-items:center;gap:14px;width:100%;padding:14px 22px;
  background:none;border:none;color:var(--wh);font-family:var(--mono);font-size:14px;
  cursor:pointer;text-align:left;transition:background .1s;}
.share-option:active{background:rgba(255,255,255,.05);}
.share-option svg{width:20px;height:20px;flex-shrink:0;color:var(--dim);}
.share-cancel{justify-content:center;color:var(--dim);border-top:1px solid rgba(255,255,255,.06);margin-top:4px;}

/* ── Toast ── */
.toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);
  background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:var(--wh);font-size:12px;padding:8px 18px;border-radius:20px;z-index:400;
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

.hidden{display:none!important;}
</style>
</head>
<body>

<!-- ── Background ── -->
<div class="bg bg-empty" id="bg"><img id="bg-img" src="" alt="" style="opacity:0"></div>

<!-- ── Header ── -->
<header>
  <button class="btn-icon" id="btn-search" aria-label="搜索">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <circle cx="10.2" cy="10.2" r="6.8"/><path d="M15.2 15.2 21 21"/>
    </svg>
  </button>
  <button class="btn-icon" id="btn-share" aria-label="分享">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7"/>
      <polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
    </svg>
  </button>
</header>

<!-- ── Player ── -->
<div class="player-area" id="player-area">

  <!-- Page 1: Vinyl -->
  <section class="page page-vinyl" id="page-vinyl">
    <div class="vinyl-container" id="vinyl-container">
      <canvas id="spectrum-canvas"></canvas>
      <div class="tonearm" id="tonearm"></div>
      <div class="vinyl" id="vinyl">
        <img class="vinyl-cover" id="vinyl-cover" src="" alt="">
        <div class="vinyl-hole"></div>
      </div>
    </div>
  </section>

  <!-- Page 2: Lyrics -->
  <section class="page page-lyric out" id="page-lyric">
    <div class="lyrics-scroll" id="lyrics-scroll">
      <div class="lyric-placeholder" id="lyric-placeholder"></div>
    </div>
  </section>
</div>

<!-- ── Footer Dock ── -->
<footer id="dock">
  <div class="song-info" id="song-info">
    <div class="song-title-row">
      <div class="song-title-left">
        <span class="song-title" id="song-title"></span>
        <span class="vip-badge hidden" id="vip-badge">VIP</span>
      </div>
      <button class="btn-like" id="btn-like" style="display:none">
        <svg class="heart-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 21s-8-5.5-8-11c0-2.76 2.24-5 5-5 1.6 0 3 .8 3 .8s1.4-.8 3-.8c2.76 0 5 2.24 5 5 0 5.5-8 11-8 11z"/>
        </svg>
        <svg class="heart-fill" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M12 21s-8-5.5-8-11c0-2.76 2.24-5 5-5 1.6 0 3 .8 3 .8s1.4-.8 3-.8c2.76 0 5 2.24 5 5 0 5.5-8 11-8 11z"/>
        </svg>
      </button>
    </div>
    <div class="song-artist" id="song-artist"></div>
  </div>
  <div class="progress-row">
    <span class="time" id="time-cur">0:00</span>
    <div class="progress-track" id="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0"></div>
    </div>
    <span class="time" id="time-dur">0:00</span>
  </div>
  <div class="dock-inner">
    <div class="controls">
      <button class="btn-ctrl" id="btn-prev" disabled aria-label="上一首">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <rect x="4" y="5" width="2" height="14" rx="1"/>
          <path d="M20 5v14l-12-7z"/>
        </svg>
      </button>
      <button class="btn-ctrl btn-play" id="btn-play" aria-label="播放">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5.14v13.72c0 .79.87 1.27 1.54.84l10.93-6.86a1 1 0 000-1.68L9.54 4.3A1 1 0 008 5.14z"/>
        </svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16" rx="1.2"/>
          <rect x="14" y="4" width="4" height="16" rx="1.2"/>
        </svg>
      </button>
      <button class="btn-ctrl" id="btn-next" disabled aria-label="下一首">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 5v14l12-7z"/>
          <rect x="18" y="5" width="2" height="14" rx="1"/>
        </svg>
      </button>
    </div>
    <div class="toolbar">
      <div class="toolbar-left">
        <!-- 聊天（占位） -->
        <button class="btn-tool" id="btn-chat" aria-label="对话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
        </button>
        <!-- 频谱光环 -->
        <button class="btn-tool" id="btn-spectrum" aria-label="频谱">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none">
            <rect x="2" y="14" width="2.4" height="6" rx="1"/>
            <rect x="6.5" y="8" width="2.4" height="12" rx="1"/>
            <rect x="11" y="4" width="2.4" height="16" rx="1"/>
            <rect x="15.5" y="10" width="2.4" height="10" rx="1"/>
            <rect x="20" y="13" width="2.4" height="7" rx="1"/>
          </svg>
        </button>
      </div>
      <div class="toolbar-right">
        <!-- 循环模式 -->
        <button class="btn-tool" id="btn-repeat" aria-label="循环模式">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">

<script>
/* ════════════════════════════════════
   STATE
════════════════════════════════════ */
const audio = document.getElementById('audio');
let currentSong = null;   // {id, name, artists, album, cover, duration, fee}
let lyricsLines = [];     // [{time, text, trans}]
let activeLyricIdx = -1;
let reportTimer = null;
let searchTimer = null;
let playError = false;

// Playlist & repeat
let playlist = [];         // [{id, name, artists, album, cover, duration, fee}]
let playIdx = -1;          // current index in playlist
let repeatMode = 'list';   // 'list' | 'one' | 'shuffle'
let currentPage = 'vinyl';
let playlists = [];        // [{id, name, count, cover}]
let activePlaylistId = null;
let dockTimer = null;

/* ════════════════════════════════════
   ELEMENTS
════════════════════════════════════ */
const $ = id => document.getElementById(id);
const el = {
  bg:           $('bg'),
  bgImg:        $('bg-img'),
  vinyl:        $('vinyl'),
  vinylCover:   $('vinyl-cover'),
  tonearm:      $('tonearm'),
  songTitle:    $('song-title'),
  songArtist:   $('song-artist'),
  vipBadge:     $('vip-badge'),
  btnLike:      $('btn-like'),
  pageVinyl:    $('page-vinyl'),
  pageLyric:    $('page-lyric'),
  lyricsScroll: $('lyrics-scroll'),
  lyricHolder:  $('lyric-placeholder'),
  timeCur:      $('time-cur'),
  timeDur:      $('time-dur'),
  progTrack:    $('progress-track'),
  progFill:     $('progress-fill'),
  btnPlay:      $('btn-play'),
  searchOverlay:$('search-overlay'),
  searchInput:  $('search-input'),
  searchResults:$('search-results'),
  searchEmpty:  $('search-empty'),
  shareOverlay: $('share-overlay'),
  toast:        $('toast'),
  dock:         $('dock'),
  btnRepeat:    $('btn-repeat'),
  btnPrev:      $('btn-prev'),
  btnNext:      $('btn-next'),
  playlistOverlay: $('playlist-overlay'),
  playlistList: $('playlist-menu-list'),
  plBack:       $('pl-back'),
  plTitle:      $('pl-header-title'),
};

/* ════════════════════════════════════
   UTILS
════════════════════════════════════ */
function fmtTime(sec) {
  if (!sec || !isFinite(sec)) return '0:00';
  const s = Math.floor(sec);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function fmtMs(ms) { return fmtTime(ms / 1000); }

function showToast(msg, ms = 2200) {
  el.toast.textContent = msg;
  el.toast.classList.add('show');
  setTimeout(() => el.toast.classList.remove('show'), ms);
}

/* ════════════════════════════════════
   SEARCH
════════════════════════════════════ */
function openSearch() {
  el.searchOverlay.classList.remove('hidden');
  setTimeout(() => el.searchInput.focus(), 80);
}
function closeSearch() {
  el.searchOverlay.classList.add('hidden');
  el.searchInput.blur();
}

$('btn-search').onclick = openSearch;
$('btn-search-close').onclick = closeSearch;

el.searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = el.searchInput.value.trim();
  if (!q) { el.searchResults.innerHTML = ''; el.searchEmpty.style.display = ''; el.searchEmpty.textContent = '输入关键词搜索'; return; }
  searchTimer = setTimeout(() => doSearch(q), 400);
});
el.searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(searchTimer); doSearch(el.searchInput.value.trim()); }
});

async function doSearch(q) {
  if (!q) return;
  el.searchEmpty.textContent = '搜索中...'; el.searchEmpty.style.display = '';
  el.searchResults.querySelectorAll('.search-item').forEach(x => x.remove());
  try {
    const r = await fetch('/api/netease/search?q=' + encodeURIComponent(q));
    const data = await r.json();
    const songs = data.songs || [];
    if (!songs.length) { el.searchEmpty.textContent = '未找到'; return; }
    el.searchEmpty.style.display = 'none';
    songs.forEach(s => {
      const div = document.createElement('div');
      div.className = 'search-item';
      const isVip = s.fee === 1;
      div.innerHTML = `
        <img class="si-cover" src="${s.cover || ''}" alt="" loading="lazy">
        <div class="si-info">
          <div class="si-title">
            <span>${esc(s.name)}</span>
            ${isVip ? '<span class="si-vip">VIP</span>' : ''}
          </div>
          <div class="si-sub">${esc(s.artists.join(' / '))}${s.album ? ' · ' + esc(s.album) : ''}</div>
        </div>
        <span class="si-dur">${fmtMs(s.duration)}</span>`;
      div.addEventListener('click', () => selectSong(s));
      el.searchResults.appendChild(div);
    });
  } catch (e) {
    el.searchEmpty.textContent = '网络错误';
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ════════════════════════════════════
   SELECT & PLAY
════════════════════════════════════ */
async function selectSong(song) {
  currentSong = song;
  // Track index in playlist
  const idx = playlist.findIndex(s => s.id === song.id);
  if (idx >= 0) playIdx = idx;
  updateSongUI(song);
  closeSearch();

  // Stream through VPS proxy (CDN URL is IP-bound, direct fetch 403s)
  audio.src = '/api/netease/song/stream?id=' + song.id;
  audio.play().catch(() => {});

  // Load lyrics
  loadLyrics(song.id);

  // Try ears
  loadEars(song.name);
}

function updateSongUI(song) {
  el.songTitle.textContent = song.name;
  el.songArtist.textContent = song.artists.join(' / ');
  el.vipBadge.classList.toggle('hidden', song.fee !== 1);
  el.btnLike.style.display = 'inline-flex';

  // Cover
  const coverUrl = (song.cover || '').replace('?param=300y300', '');
  if (coverUrl) {
    el.vinylCover.src = song.cover;
    el.bgImg.src = coverUrl + '?param=400y400';
    el.bgImg.onload = () => { el.bgImg.style.opacity = 1; el.bg.classList.remove('bg-empty'); };
  }
}

/* ════════════════════════════════════
   AUDIO EVENTS
════════════════════════════════════ */
audio.addEventListener('play', () => {
  playError = false;
  el.vinyl.classList.add('spinning');
  el.tonearm.classList.add('on');
  el.btnPlay.classList.add('playing');
  startReporting();
});
audio.addEventListener('pause', () => {
  el.vinyl.classList.remove('spinning');
  el.tonearm.classList.remove('on');
  el.btnPlay.classList.remove('playing');
});
audio.addEventListener('ended', () => {
  clearInterval(reportTimer);
  if (repeatMode === 'one') {
    audio.currentTime = 0; audio.play().catch(() => {});
  } else if (playlist.length > 0) {
    playNext();
  } else {
    el.vinyl.classList.remove('spinning');
    el.tonearm.classList.remove('on');
    el.btnPlay.classList.remove('playing');
  }
});
audio.addEventListener('error', () => {
  playError = true;
  el.vinyl.classList.remove('spinning');
  el.tonearm.classList.remove('on');
  el.btnPlay.classList.remove('playing');
  showToast('播放失败 — 点击重试');
});
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  const pct = (audio.currentTime / audio.duration) * 100;
  el.progFill.style.width = pct + '%';
  el.timeCur.textContent = fmtTime(audio.currentTime);
  el.timeDur.textContent = fmtTime(audio.duration);
  syncLyrics(audio.currentTime);
});

/* ════════════════════════════════════
   SPECTRUM RING
════════════════════════════════════ */
let audioCtx, analyser, freqData;
let specOn = false, specRAF = null, specInnerR = 0;
const specCanvas = $('spectrum-canvas');
const specCtx = specCanvas.getContext('2d');
const SPEC_PAD = 40;
const SPEC_BARS = 80;

function initAnalyser() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaElementSource(audio);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.82;
  freqData = new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser);
  analyser.connect(audioCtx.destination);
}

function sizeSpecCanvas() {
  const vs = el.vinyl.offsetWidth;
  if (!vs) return;
  specInnerR = vs / 2 + 3;
  const sz = vs + SPEC_PAD * 2;
  const dpr = window.devicePixelRatio || 1;
  specCanvas.width = sz * dpr;
  specCanvas.height = sz * dpr;
  specCanvas.style.width = sz + 'px';
  specCanvas.style.height = sz + 'px';
  specCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawSpec() {
  specRAF = requestAnimationFrame(drawSpec);
  const sz = parseFloat(specCanvas.style.width) || 0;
  if (!sz || !analyser) return;
  specCtx.clearRect(0, 0, sz, sz);
  if (audio.paused) return;
  analyser.getByteFrequencyData(freqData);
  const cx = sz / 2, cy = sz / 2;
  const maxBar = SPEC_PAD - 6;
  for (let i = 0; i < SPEC_BARS; i++) {
    const di = Math.floor(i * freqData.length / SPEC_BARS);
    const val = freqData[di] / 255;
    if (val < 0.02) continue;
    const ang = (i / SPEC_BARS) * Math.PI * 2 - Math.PI / 2;
    const len = val * maxBar + 2;
    const cos = Math.cos(ang), sin = Math.sin(ang);
    specCtx.beginPath();
    specCtx.moveTo(cx + cos * specInnerR, cy + sin * specInnerR);
    specCtx.lineTo(cx + cos * (specInnerR + len), cy + sin * (specInnerR + len));
    specCtx.strokeStyle = 'rgba(200,190,240,' + (0.1 + val * 0.6).toFixed(2) + ')';
    specCtx.lineWidth = 2.5;
    specCtx.lineCap = 'round';
    specCtx.stroke();
  }
}

function startSpec() { if (!specRAF) { sizeSpecCanvas(); specRAF = requestAnimationFrame(drawSpec); } }
function stopSpec() {
  if (specRAF) { cancelAnimationFrame(specRAF); specRAF = null; }
  const sz = parseFloat(specCanvas.style.width) || 0;
  if (sz) specCtx.clearRect(0, 0, sz, sz);
}

// Keep AudioContext alive once created (audio routes through it)
audio.addEventListener('play', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  if (specOn && currentPage === 'vinyl') startSpec();
});

$('btn-spectrum').onclick = () => {
  specOn = !specOn;
  $('vinyl-container').classList.toggle('spectrum-on', specOn);
  $('btn-spectrum').classList.toggle('active', specOn);
  if (specOn) { initAnalyser(); startSpec(); }
  else stopSpec();
};

el.btnPlay.onclick = () => {
  if (!currentSong) { openSearch(); return; }
  if (playError && currentSong) {
    playError = false;
    audio.src = '/api/netease/song/stream?id=' + currentSong.id;
    audio.play().catch(() => {});
    return;
  }
  if (audio.paused) audio.play().catch(() => {}); else audio.pause();
};

/* ════════════════════════════════════
   PROGRESS BAR SEEK
════════════════════════════════════ */
let dragging = false;
function seekFromEvent(e) {
  const rect = el.progTrack.getBoundingClientRect();
  const cx = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
  const pct = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
  if (audio.duration) audio.currentTime = pct * audio.duration;
}
el.progTrack.addEventListener('pointerdown', e => { dragging = true; seekFromEvent(e); el.progTrack.setPointerCapture(e.pointerId); });
el.progTrack.addEventListener('pointermove', e => { if (dragging) seekFromEvent(e); });
el.progTrack.addEventListener('pointerup', () => { dragging = false; });

/* ════════════════════════════════════
   PAGE SWITCHING
════════════════════════════════════ */
function showPage(name) {
  currentPage = name;
  el.pageVinyl.classList.toggle('out', name !== 'vinyl');
  el.pageLyric.classList.toggle('out', name !== 'lyric');
  // Spectrum: stop on lyrics, resume on vinyl
  if (name === 'vinyl' && specOn && !audio.paused) startSpec();
  if (name !== 'vinyl') stopSpec();
  // Auto-collapse dock on lyrics page after 5s
  clearTimeout(dockTimer);
  if (name === 'lyric') {
    dockTimer = setTimeout(() => el.dock.classList.add('collapsed'), 5000);
  } else {
    el.dock.classList.remove('collapsed');
  }
}

el.pageVinyl.addEventListener('click', e => {
  if (e.target.closest('button')) return;
  if (!currentSong) { openSearch(); return; }
  showPage('lyric');
});

el.lyricsScroll.addEventListener('click', e => {
  const line = e.target.closest('.lyric-line') || e.target.closest('.lyric-trans');
  if (line && line.dataset.time) {
    const t = parseFloat(line.dataset.time);
    if (!isNaN(t) && audio.duration) { audio.currentTime = t; if (audio.paused) audio.play().catch(() => {}); }
    return;
  }
  showPage('vinyl');
});

/* ════════════════════════════════════
   LYRICS
════════════════════════════════════ */
async function loadLyrics(songId) {
  lyricsLines = [];
  activeLyricIdx = -1;
  el.lyricHolder.textContent = '';
  el.lyricHolder.style.display = '';
  el.lyricsScroll.querySelectorAll('.lyric-line,.lyric-trans,.lyric-spacer-top,.lyric-spacer-bot').forEach(x => x.remove());

  try {
    const r = await fetch('/api/netease/lyric?id=' + songId);
    const data = await r.json();
    // Backend returns {orig: [{time_ms, text}], trans: [{time_ms, text}]}
    const skip = /^(作词|作曲|编曲|制作)/;
    const main = (data.orig || []).filter(l => l.text && !skip.test(l.text));
    if (!main.length) { el.lyricHolder.textContent = '暂无歌词'; return; }
    const tmap = {};
    (data.trans || []).forEach(l => { if (l.text) tmap[l.time_ms] = l.text; });
    lyricsLines = main.map(l => ({
      time: l.time_ms / 1000,
      text: l.text,
      trans: tmap[l.time_ms] || '',
    }));
    renderLyricLines();
  } catch (e) {
    el.lyricHolder.textContent = '歌词加载失败';
  }
}

function renderLyricLines() {
  el.lyricHolder.style.display = 'none';
  // Top spacer
  const st = document.createElement('div'); st.className = 'lyric-spacer-top'; el.lyricsScroll.appendChild(st);
  lyricsLines.forEach((l, i) => {
    const div = document.createElement('div');
    div.className = 'lyric-line';
    div.textContent = l.text;
    div.dataset.time = l.time;
    div.dataset.idx = i;
    el.lyricsScroll.appendChild(div);
    if (l.trans) {
      const t = document.createElement('div');
      t.className = 'lyric-trans';
      t.textContent = l.trans;
      t.dataset.time = l.time;
      el.lyricsScroll.appendChild(t);
    }
  });
  // Bottom spacer
  const sb = document.createElement('div'); sb.className = 'lyric-spacer-bot'; el.lyricsScroll.appendChild(sb);
}

function syncLyrics(curTime) {
  if (!lyricsLines.length) return;
  let idx = -1;
  for (let i = lyricsLines.length - 1; i >= 0; i--) {
    if (curTime >= lyricsLines[i].time) { idx = i; break; }
  }
  if (idx === activeLyricIdx) return;
  activeLyricIdx = idx;

  const allEls = el.lyricsScroll.querySelectorAll('.lyric-line');
  allEls.forEach((el, i) => {
    const d = Math.abs(i - idx);
    el.classList.toggle('active', i === idx);
    el.classList.toggle('near', d === 1 || d === 2);
  });

  // Scroll active into view
  if (idx >= 0 && allEls[idx]) {
    const line = allEls[idx];
    const wrap = el.lyricsScroll;
    const target = line.offsetTop - wrap.clientHeight / 2 + line.clientHeight / 2;
    wrap.scrollTo({ top: target, behavior: 'smooth' });
  }
}

/* ════════════════════════════════════
   EARS (placeholder — cut 3)
════════════════════════════════════ */
async function loadEars(title) {
  try {
    const r = await fetch('/api/ears/' + encodeURIComponent(title));
    if (!r.ok) return;
    // ears data loaded — will be used in cut 3
  } catch (e) {}
}

/* ════════════════════════════════════
   LIKE
════════════════════════════════════ */
el.btnLike.onclick = async () => {
  if (!currentSong) return;
  const isLiked = el.btnLike.classList.contains('liked');
  el.btnLike.classList.toggle('liked');
  try {
    await fetch('/api/netease/like', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: currentSong.id, like: !isLiked }),
    });
    showToast(isLiked ? '已取消喜欢' : '已添加喜欢');
  } catch (e) {
    el.btnLike.classList.toggle('liked');
    showToast('操作失败');
  }
};

/* ════════════════════════════════════
   SHARE MENU
════════════════════════════════════ */
function openShare() { if (currentSong) el.shareOverlay.classList.remove('hidden'); }
function closeShare() { el.shareOverlay.classList.add('hidden'); }

$('btn-share').onclick = openShare;
$('share-cancel').onclick = closeShare;
el.shareOverlay.addEventListener('click', e => { if (e.target === el.shareOverlay) closeShare(); });

$('share-am').onclick = () => {
  if (!currentSong) return;
  const q = encodeURIComponent(currentSong.name + ' ' + currentSong.artists[0]);
  window.open('https://music.apple.com/search?term=' + q, '_blank');
  closeShare();
};
$('share-link').onclick = () => {
  if (!currentSong) return;
  const url = 'https://music.163.com/song?id=' + currentSong.id;
  navigator.clipboard.writeText(url).then(
    () => showToast('已复制链接'),
    () => showToast('复制失败')
  );
  closeShare();
};

/* ════════════════════════════════════
   NOW-PLAYING REPORT
════════════════════════════════════ */
function startReporting() {
  clearInterval(reportTimer);
  reportTimer = setInterval(reportNowPlaying, 5000);
  reportNowPlaying();
}
function reportNowPlaying() {
  if (!currentSong) return;
  fetch('/api/music/now-playing', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      playing: !audio.paused,
      id: currentSong.id,
      name: currentSong.name,
      artists: currentSong.artists,
      progress: audio.currentTime || 0,
      duration: audio.duration || 0,
      cover: currentSong.cover || '',
    }),
  }).catch(() => {});
}

/* ════════════════════════════════════
   DOCK COLLAPSE / EXPAND
════════════════════════════════════ */
function expandDock() {
  el.dock.classList.remove('collapsed');
  clearTimeout(dockTimer);
  if (currentPage === 'lyric') {
    dockTimer = setTimeout(() => el.dock.classList.add('collapsed'), 5000);
  }
}
// Touch / scroll → expand dock
el.dock.addEventListener('pointerdown', expandDock);
el.lyricsScroll.addEventListener('scroll', expandDock, { passive: true });
el.lyricsScroll.addEventListener('touchstart', expandDock, { passive: true });

/* ════════════════════════════════════
   REPEAT MODE
════════════════════════════════════ */
const repeatIcons = {
  list: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/>
    <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>`,
  one: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 014-4h14"/>
    <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 01-4 4H3"/>
    <text x="12" y="15" text-anchor="middle" font-size="8" font-weight="700" fill="currentColor" stroke="none">1</text></svg>`,
  shuffle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/>
    <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>
    <line x1="4" y1="4" x2="9" y2="9"/></svg>`,
};
function cycleRepeat() {
  const modes = ['list', 'one', 'shuffle'];
  const i = modes.indexOf(repeatMode);
  repeatMode = modes[(i + 1) % modes.length];
  el.btnRepeat.innerHTML = repeatIcons[repeatMode];
  el.btnRepeat.classList.toggle('active', repeatMode !== 'list');
  const labels = { list: '列表循环', one: '单曲循环', shuffle: '随机播放' };
  showToast(labels[repeatMode]);
}
el.btnRepeat.onclick = cycleRepeat;

/* ════════════════════════════════════
   PLAYLIST & PREV/NEXT
════════════════════════════════════ */
function playNext() {
  if (!playlist.length) return;
  if (repeatMode === 'shuffle') {
    playIdx = Math.floor(Math.random() * playlist.length);
  } else {
    playIdx = (playIdx + 1) % playlist.length;
  }
  selectSong(playlist[playIdx]);
  updateNavButtons();
}
function playPrev() {
  if (!playlist.length) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  if (repeatMode === 'shuffle') {
    playIdx = Math.floor(Math.random() * playlist.length);
  } else {
    playIdx = (playIdx - 1 + playlist.length) % playlist.length;
  }
  selectSong(playlist[playIdx]);
  updateNavButtons();
}
function updateNavButtons() {
  const has = playlist.length > 0;
  el.btnPrev.disabled = !has;
  el.btnNext.disabled = !has;
}
el.btnPrev.onclick = playPrev;
el.btnNext.onclick = playNext;

/* ════════════════════════════════════
   PLAYLIST MENU
════════════════════════════════════ */
let plView = 'list'; // 'list' or 'detail'

function openPlaylistMenu() {
  el.playlistOverlay.classList.remove('hidden');
  showPlaylistList();
}
function closePlaylistMenu() { el.playlistOverlay.classList.add('hidden'); }

function showPlaylistList() {
  plView = 'list';
  el.plTitle.textContent = '歌单';
  el.plBack.style.visibility = 'hidden';
  loadPlaylists();
}

$('btn-playlist-menu').onclick = openPlaylistMenu;
el.plBack.onclick = () => {
  if (plView === 'detail') showPlaylistList();
  else closePlaylistMenu();
};
// Swipe down or tap outside header to close
el.playlistList.addEventListener('click', e => {
  if (e.target === el.playlistList && plView === 'list') closePlaylistMenu();
});

async function loadPlaylists() {
  const msg = '<div style="text-align:center;padding:24px;color:var(--dim);font-size:13px">';
  el.playlistList.innerHTML = msg + '加载中...</div>';
  try {
    const r = await fetch('/api/netease/playlists');
    const data = await r.json();
    playlists = data.playlists || [];
    if (!playlists.length) { el.playlistList.innerHTML = msg + '未找到歌单</div>'; return; }
    el.playlistList.innerHTML = '';
    playlists.forEach(p => {
      const div = document.createElement('div');
      div.className = 'playlist-item' + (p.id === activePlaylistId ? ' current' : '');
      div.innerHTML = `<img class="pi-cover" src="${p.cover}?param=100y100" alt="" loading="lazy">
        <span class="pi-name">${esc(p.name)}</span>
        <span class="pi-count">${p.count}首</span>`;
      div.addEventListener('click', () => loadPlaylistDetail(p));
      el.playlistList.appendChild(div);
    });
  } catch (e) {
    el.playlistList.innerHTML = msg + '加载失败</div>';
  }
}

async function loadPlaylistDetail(p) {
  plView = 'detail';
  el.plTitle.textContent = p.name;
  el.plBack.style.visibility = 'visible';
  const msg = '<div style="text-align:center;padding:24px;color:var(--dim);font-size:13px">';
  el.playlistList.innerHTML = msg + '加载中...</div>';
  try {
    const r = await fetch('/api/netease/playlist/detail?id=' + p.id);
    const data = await r.json();
    playlist = data.songs || [];
    activePlaylistId = p.id;
    playIdx = -1;
    updateNavButtons();
    el.playlistList.innerHTML = '';
    playlist.forEach((s, i) => {
      const div = document.createElement('div');
      div.className = 'song-item' + (currentSong && currentSong.id === s.id ? ' playing' : '');
      const isVip = s.fee === 1;
      div.innerHTML = `<img class="si2-cover" src="${s.cover ? s.cover + '?param=96y96' : ''}" alt="" loading="lazy">
        <div class="si2-info">
          <div class="si2-name"><span>${esc(s.name)}</span>${isVip ? '<span class="si-vip">VIP</span>' : ''}</div>
          <div class="si2-artist">${esc(s.artists.join(' / '))}</div>
        </div>`;
      div.addEventListener('click', () => {
        playIdx = i;
        selectSong(s);
        closePlaylistMenu();
      });
      el.playlistList.appendChild(div);
    });
  } catch (e) {
    el.playlistList.innerHTML = msg + '加载失败</div>';
  }
}

// Chat button placeholder
$('btn-chat').onclick = () => showToast('对话功能开发中');
